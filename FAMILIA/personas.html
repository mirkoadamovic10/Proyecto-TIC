```html id="m2k7rc"
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personas - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="barra-familia">

        <nav class="menu-familia" aria-label="Navegación principal">

            <a href="familia.html" class="boton-menu-familia">
                Inicio
            </a>

            <a href="personas.html" class="boton-menu-familia">
                Personas
            </a>

            <a href="agenda-familia.html" class="boton-menu-familia">
                Agenda
            </a>

        </nav>


        <a
            href="configuracion.html"
            class="perfil-familia"
            id="perfilFamilia"
            aria-label="Configuración">

            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>

        </a>

    </header>


    <main class="familia-pagina">

        <section>

            <header class="personas-superior">

                <div>

                    <h1>Personas</h1>

                    <p class="texto-familia">
                        Personas vinculadas a tu cuenta.
                    </p>

                </div>


                <button
                    type="button"
                    class="boton-nueva-persona"
                    id="botonNuevaPersona">

                    + Linkear persona

                </button>

            </header>


            <div
                id="listaPersonas"
                class="lista-personas">
            </div>

        </section>

    </main>


    <aside
        id="ventanaLinkearFamilia"
        class="ventana-linkear-familia">

        <section class="formulario-linkear-familia">

            <button
                type="button"
                class="cerrar-linkear-familia"
                id="cerrarLinkearFamilia"
                aria-label="Cerrar">

                ×

            </button>


            <header>

                <h2>Linkear persona</h2>

                <p>
                    Ingresá el correo electrónico de la persona que querés vincular.
                </p>

            </header>


            <form>

                <label for="emailPersona">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="emailPersona"
                    placeholder="persona@email.com">


                <button
                    type="button"
                    class="boton-enviar-solicitud-familia"
                    id="botonEnviarSolicitudFamilia">

                    Enviar solicitud

                </button>

            </form>


            <output
                id="mensajeSolicitudFamilia"
                class="mensaje-solicitud-familia">
            </output>

        </section>

    </aside>


    <script src="personas.js"></script>

</body>

</html>
```
