<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkear - NeuroPassport</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="barra-personal">

        <nav class="menu-personal">

            <a href="familia.html" class="boton-menu">
                Inicio
            </a>

            <button type="button" class="boton-menu">
                Linkear
            </button>

            <a href="#" class="boton-menu">
                Agenda
            </a>

        </nav>

    </header>

    <main class="pagina-linkear">

        <section class="tarjeta-linkear">

            <h1>Linkear</h1>

            <p>
                Ingresá el código de la persona que querés vincular.
            </p>

            <div class="campo-linkear">

                <label for="codigo">Código de vinculación</label>

                <input
                    type="text"
                    id="codigo"
                    placeholder="Ingresá el código">

            </div>

            <button type="button" class="boton-linkear" id="botonLinkear">
                Linkear
            </button>

            <p id="mensajeLinkear"></p>

        </section>

    </main>

    <script src="linkear.js"></script>

</body>

</html>
