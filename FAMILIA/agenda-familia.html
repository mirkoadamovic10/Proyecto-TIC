```html id="v4m8zs"
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="pagina-agenda">

    <header class="barra-agenda">

        <h2>NeuroPassport</h2>

        <nav class="menu-agenda" aria-label="Navegación principal">

            <button
                class="boton-menu-agenda"
                onclick="window.location.href='familia.html'">
                Inicio
            </button>

            <button
                class="boton-menu-agenda"
                onclick="window.location.href='personas.html'">
                Personas
            </button>

            <button
                class="boton-menu-agenda activo">
                Agenda
            </button>

            <aside class="perfil-agenda" aria-label="Perfil de usuario">

                <span class="perfil-cabeza"></span>
                <span class="perfil-cuerpo"></span>

            </aside>

        </nav>

    </header>


    <main class="agenda-principal">

        <article class="agenda-contenedor">

            <header class="agenda-superior">

                <div>

                    <h1>Agenda</h1>

                    <p>
                        Organizá los turnos, estudios, terapias y controles médicos.
                    </p>

                </div>

                <button
                    id="botonAgregarEvento"
                    class="boton-agregar-evento">

                    + Agregar evento

                </button>

            </header>


            <section class="calendario">

                <header class="calendario-cabecera">

                    <button
                        id="mesAnterior"
                        class="boton-mes">

                        ‹

                    </button>

                    <h2 id="mesActual"></h2>

                    <button
                        id="mesSiguiente"
                        class="boton-mes">

                        ›

                    </button>

                </header>


                <div
                    class="dias-semana"
                    aria-label="Días de la semana">

                    <span>Lun</span>
                    <span>Mar</span>
                    <span>Mié</span>
                    <span>Jue</span>
                    <span>Vie</span>
                    <span>Sáb</span>
                    <span>Dom</span>

                </div>


                <div
                    id="diasCalendario"
                    class="dias-calendario">
                </div>

            </section>


            <aside class="referencias" aria-label="Referencias de eventos">

                <div class="referencia">

                    <span class="color-referencia turno"></span>
                    <span>Turno médico</span>

                </div>


                <div class="referencia">

                    <span class="color-referencia estudio"></span>
                    <span>Estudio médico</span>

                </div>


                <div class="referencia">

                    <span class="color-referencia terapia"></span>
                    <span>Terapia</span>

                </div>


                <div class="referencia">

                    <span class="color-referencia medicacion"></span>
                    <span>Medicación</span>

                </div>


                <div class="referencia">

                    <span class="color-referencia control"></span>
                    <span>Control / seguimiento</span>

                </div>

            </aside>

        </article>

    </main>


    <dialog
        id="ventanaEvento"
        class="ventana-evento">

        <form class="formulario-evento">

            <button
                type="button"
                id="cerrarEvento"
                class="cerrar-evento">

                ×

            </button>


            <header>

                <h2>Agregar evento</h2>

                <p>
                    Completá la información del evento.
                </p>

            </header>


            <label for="tituloEvento">
                Nombre del evento
            </label>

            <input
                type="text"
                id="tituloEvento"
                placeholder="Ej. Turno con el neurólogo">


            <label for="fechaEvento">
                Fecha
            </label>

            <input
                type="date"
                id="fechaEvento">


            <label for="horaEvento">
                Hora
            </label>

            <input
                type="time"
                id="horaEvento">


            <label for="tipoEvento">
                Tipo de evento
            </label>

            <select id="tipoEvento">

                <option value="turno">
                    Turno médico
                </option>

                <option value="estudio">
                    Estudio médico
                </option>

                <option value="terapia">
                    Terapia
                </option>

                <option value="medicacion">
                    Medicación
                </option>

                <option value="control">
                    Control / seguimiento
                </option>

            </select>


            <label for="descripcionEvento">
                Descripción
            </label>

            <textarea
                id="descripcionEvento"
                placeholder="Agregá información adicional...">
            </textarea>


            <button
                id="guardarEvento"
                class="boton-guardar-evento">

                Guardar evento

            </button>

        </form>

    </dialog>


    <script src="agenda-familia.js"></script>

</body>

</html>
```
