<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospitales - NeuroPassport</title>

    <link rel="stylesheet" href="../../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        /* NAVBAR AZUL */

        .barra-empresa {
            width: 100%;
            min-height: 54px;
            padding: 8px 24px;
            background: #2D7289 !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* TEXTO NEUROPASSPORT Y BOTÓN DE PERFIL EN LA NAVBAR */

        .barra-empresa {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .barra-empresa .logo-navbar {
            margin: 0;
            padding: 0;
            color: #D9E2E3 !important;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
        }

        .barra-empresa .perfil-empresa,
        .barra-empresa .perfil-empresa:hover,
        .barra-empresa .perfil-empresa:focus,
        .barra-empresa .perfil-empresa:active {
            width: 42px !important;
            height: 42px !important;
            min-width: 42px;
            margin: -6px 0 !important;
            padding: 0 !important;

            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;

            background: #D9D9D9 !important;
            border: none !important;
            border-radius: 50% !important;
            box-shadow: none !important;

            text-decoration: none;
            transform: translateY(-12px) !important;
            transition: none !important;
            animation: none !important;
        }

        .barra-empresa .perfil-empresa .perfil-cabeza {
            display: block !important;
            width: 11px !important;
            height: 11px !important;
            margin: 0 !important;
            background: #000000 !important;
            border-radius: 50% !important;
        }

        .barra-empresa .perfil-empresa .perfil-cuerpo {
            display: block !important;
            width: 20px !important;
            height: 10px !important;
            margin: 0 !important;
            background: #000000 !important;
            border-radius: 10px 10px 5px 5px !important;
        }

        /* CONTENIDO PRINCIPAL */

        .pagina-hospitales {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 34px 20px 20px;
        }

        /* BOTÓN VOLVER */

        .boton-volver,
        .boton-volver:hover,
        .boton-volver:focus,
        .boton-volver:active {
            position: absolute;
            top: 27px;
            left: 13px;
            display: flex;
            align-items: center;
            gap: 7px;
            height: 28px;
            margin: 0;
            padding: 0 7px 0 6px;
            background: #B7E4C7 !important;
            color: #2F7185 !important;
            border: none !important;
            border-radius: 10px;
            box-shadow: none !important;
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            text-decoration: none;
            transform: none !important;
        }

        .boton-volver:hover {
            background: #A5D9B8 !important;
        }

        .boton-volver .flecha-volver {
            font-size: 14px;
            font-weight: 300;
            line-height: 1;
        }

        /* TÍTULO Y SUBTÍTULO */

        .encabezado-hospitales {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 0 32px;
            padding: 0;
            text-align: center;
            background: transparent;
            border: none;
        }

        .encabezado-hospitales h1 {
            width: 100%;
            margin: 0;
            padding: 0;
            font-size: 35.2px;
            line-height: 42px;
            font-weight: 700;
            color: #000000;
            text-align: center;
        }

        .encabezado-hospitales p {
            width: 100%;
            margin: 5px 0 0;
            padding: 0;
            font-size: 15px;
            line-height: 22px;
            font-weight: 400;
            color: #000000;
            text-align: center;
        }

        /* PANEL VERDE: VINCULARSE */

        .panel-vincular {
            position: relative;
            width: 100%;
            max-width: 916px;
            margin: 0 auto 10px;
            padding: 42px 20px 53px;
            background: #CFE7D9;
            border: none;
            border-radius: 16px;
            box-shadow: none;
            text-align: center;
        }

        .panel-vincular > header {
            width: 100%;
            margin: 0 0 37px;
            padding: 0;
            background: transparent;
            border: none;
            text-align: center;
        }

        .panel-vincular h2 {
            width: 100%;
            margin: 0;
            font-size: 24px;
            line-height: 28px;
            font-weight: 700;
            color: #2F7185;
            text-align: center;
        }

        .formulario-vincular {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 36px;
            margin: 0;
            padding: 0;
        }

        .grupo-codigo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 439px;
            max-width: 100%;
        }

        .grupo-codigo label {
            margin: 0;
            font-size: 20px;
            line-height: 24px;
            font-weight: 700;
            color: #2F7185;
        }

        .grupo-codigo input {
            width: 100%;
            height: 49px;
            margin: 0;
            padding: 0 29px;
            background: #DDECE2;
            color: #2F7185;
            border: none;
            border-radius: 10px;
            box-shadow: none;
            font: inherit;
            font-size: 18px;
            font-weight: 400;
        }

        .grupo-codigo input::placeholder {
            color: #8C9B92;
            opacity: 1;
        }

        .grupo-codigo input:focus {
            outline: 2px solid #2F7185;
        }

        .boton-vincularse,
        .boton-vincularse:hover,
        .boton-vincularse:focus,
        .boton-vincularse:active {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 14px;
            flex: 0 0 180px;
            width: 180px;
            height: 58px;
            margin: 0;
            padding: 0 0 0 24px;
            background: #2F7185 !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 12px;
            box-shadow: none !important;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            transform: none !important;
        }

        .boton-vincularse:hover {
            background: #285F70 !important;
        }

        /* Símbolo + dibujado con CSS */
        .boton-vincularse .icono-mas {
            position: relative;
            display: block;
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
        }

        .boton-vincularse .icono-mas::before,
        .boton-vincularse .icono-mas::after {
            content: "";
            position: absolute;
            background: #FFFFFF;
        }

        .boton-vincularse .icono-mas::before {
            top: 9px;
            left: 0;
            width: 20px;
            height: 2px;
        }

        .boton-vincularse .icono-mas::after {
            top: 0;
            left: 9px;
            width: 2px;
            height: 20px;
        }

        /* El mensaje no ocupa espacio, así el panel mantiene su tamaño */
        .mensaje-hospital {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 16px;
            font-size: 14px;
            line-height: 1.4;
            color: #2F7185;
        }

        .mensaje-hospital:empty {
            display: none;
        }

        /* PANEL BLANCO: HOSPITALES VINCULADOS */

        .panel-vinculados {
            width: 100%;
            max-width: 916px;
            margin: 0 auto;
            padding: 56px 71px 65px;
            background: #FFFFFF;
            border: none;
            border-radius: 16px;
            box-shadow: none;
            text-align: center;
        }

        .panel-vinculados > header {
            width: 100%;
            margin: 0 0 37px;
            padding: 0;
            background: transparent;
            border: none;
            text-align: center;
        }

        .panel-vinculados h2 {
            width: 100%;
            margin: 0;
            font-size: 24px;
            line-height: 28px;
            font-weight: 700;
            color: #2F7185;
            text-align: center;
        }

        .lista-hospital {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .mensaje-vacio {
            width: 100%;
            margin: 0;
            padding: 16px;
            background: #F9F9F9;
            color: #909090;
            border: 1px dotted #333333;
            border-radius: 8px;
            font-size: 18px;
            line-height: 27px;
            font-weight: 400;
            text-align: center;
        }

        .tarjeta-hospital {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 13px;
            width: 100%;
            min-height: 58px;
            margin: 0;
            padding: 9px 14px;
            background: #F9F9F9;
            border: 1px dotted #333333;
            border-radius: 8px;
            text-align: left;
        }

        .tarjeta-hospital h3 {
            flex: 0 0 auto;
            margin: 0;
            padding: 0;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .tarjeta-hospital p {
            flex: 1;
            min-width: 0;
            margin: 0;
            padding: 0;
            color: #555;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .boton-ver-hospital {
            flex-shrink: 0;
            padding: 9px 14px;
            background: #B7E4C7 !important;
            color: #285866 !important;
            border: none !important;
            border-radius: 8px;
            box-shadow: none !important;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .boton-ver-hospital:hover {
            background: #A5D9B8 !important;
        }

        /* CELULARES */

        @media (max-width: 700px) {
            .pagina-hospitales {
                padding: 14px 14px 20px;
            }

            .boton-volver,
            .boton-volver:hover,
            .boton-volver:focus,
            .boton-volver:active {
                position: static;
                width: fit-content;
                margin: 0 0 14px;
            }

            .panel-vincular {
                padding: 30px 16px 56px;
            }

            .panel-vinculados {
                padding: 36px 16px 40px;
            }

            .formulario-vincular {
                flex-direction: column;
                gap: 16px;
            }

            .grupo-codigo {
                width: 100%;
            }

            .tarjeta-hospital {
                flex-wrap: wrap;
            }
        }

        /* ELIMINAR FONDOS MARRONES DEL CSS EXTERNO EN TEXTOS Y ENCABEZADOS */
        .pagina-hospitales header,
        .pagina-hospitales h1,
        .pagina-hospitales h2,
        .pagina-hospitales h3,
        .pagina-hospitales p,
        .pagina-hospitales label {
            background: transparent !important;
            background-color: transparent !important;
            background-image: none !important;
        }

        /* ============================= */
        /* FOTO DE PERFIL EN EL BOTÓN    */
        /* (la que se elige en Configuración) */
        /* ============================= */

        .con-foto-perfil {
            padding: 0 !important;
            overflow: hidden !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        /* Con foto se oculta el muñequito */
        .con-foto-perfil > * {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- NAVBAR AZUL -->
    <header class="barra-empresa">

        <p class="logo-navbar">NeuroPassport</p>

        <a
            href="configuracion.html"
            class="perfil-empresa"
            id="botonPerfil"
            title="Perfil"
            aria-label="Perfil">

            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>

        </a>

    </header>

    <main class="pagina-hospitales">

        <a href="hospital.html" class="boton-volver">
            <span class="flecha-volver" aria-hidden="true">←</span>
            Volver
        </a>

        <header class="encabezado-hospitales">
            <h1>Hospitales</h1>
            <p>Administrá tus vinculos con hospitales</p>
        </header>

        <!-- VINCULARSE A UN HOSPITAL -->
        <section class="panel-vincular" aria-labelledby="tituloVincular">

            <header>
                <h2 id="tituloVincular">Vincularse a un hospital</h2>
            </header>

            <form id="formularioHospital" class="formulario-vincular">

                <div class="grupo-codigo">
                    <label for="codigoHospital">Código del hospital</label>

                    <input
                        type="text"
                        id="codigoHospital"
                        name="codigoHospital"
                        placeholder="Ingresá el código"
                        autocomplete="off"
                        required>
                </div>

                <button type="submit" class="boton-vincularse">
                    <span class="icono-mas" aria-hidden="true"></span>
                    Vincularse
                </button>

            </form>

            <output id="mensajeHospital" class="mensaje-hospital" aria-live="polite"></output>

        </section>

        <!-- HOSPITALES VINCULADOS -->
        <section class="panel-vinculados" aria-labelledby="tituloVinculados">

            <header>
                <h2 id="tituloVinculados">Hospitales vinculados</h2>
            </header>

            <section
                id="hospitalesVinculados"
                class="lista-hospital"
                aria-label="Hospitales vinculados">

                <p class="mensaje-vacio">
                    No hay hospitales vinculados todavía.
                </p>

            </section>

        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const formulario = document.getElementById("formularioHospital");
            const codigoInput = document.getElementById("codigoHospital");
            const mensaje = document.getElementById("mensajeHospital");
            const lista = document.getElementById("hospitalesVinculados");

            let hospitales = [];

            try {
                hospitales = JSON.parse(
                    localStorage.getItem("hospitalesVinculados")
                ) || [];
            } catch (error) {
                hospitales = [];
            }

            function mostrarHospitales() {
                lista.innerHTML = "";

                if (hospitales.length === 0) {
                    const texto = document.createElement("p");
                    texto.className = "mensaje-vacio";
                    texto.textContent = "No hay hospitales vinculados todavía.";
                    lista.appendChild(texto);
                    return;
                }

                hospitales.forEach(function (hospital, indice) {
                    const tarjeta = document.createElement("article");
                    tarjeta.className = "tarjeta-hospital";

                    const nombre = document.createElement("h3");
                    nombre.textContent = hospital.nombre || "Hospital vinculado";

                    const codigo = document.createElement("p");
                    codigo.textContent = "Código: " + hospital.codigo;

                    const botonVer = document.createElement("button");
                    botonVer.type = "button";
                    botonVer.className = "boton-ver-hospital";
                    botonVer.textContent = "Ver información";

                    botonVer.addEventListener("click", function () {
                        localStorage.setItem(
                            "hospitalSeleccionado",
                            JSON.stringify(hospitales[indice])
                        );

                        alert("Hospital seleccionado.");
                    });

                    tarjeta.append(nombre, codigo, botonVer);
                    lista.appendChild(tarjeta);
                });
            }

            formulario.addEventListener("submit", async function (evento) {
                evento.preventDefault();

                const codigo = codigoInput.value.trim();

                if (!codigo) {
                    mensaje.textContent = "Ingresá el código del hospital.";
                    return;
                }

                const existe = hospitales.some(function (hospital) {
                    return String(hospital.codigo).toLowerCase() === codigo.toLowerCase();
                });

                if (existe) {
                    mensaje.textContent = "Este hospital ya está vinculado.";
                    return;
                }

                // POST /api/hospitales/vincular-medico
                // El código es el número que ve el hospital en su pantalla de inicio
                const idHospital = Number(codigo.replace(/\D/g, ""));
                const idMedico = Number(localStorage.getItem("idUsuario")) || null;

                if (idHospital && idMedico) {
                    try {
                        const respuesta = await fetch("http://localhost:3000/api/hospitales/vincular-medico", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ idHospital: idHospital, idMedico: idMedico })
                        });

                        if (!respuesta.ok) {
                            const error = await respuesta.json().catch(() => ({}));
                            mensaje.textContent = error.error === "Hospital o médico no encontrado."
                                ? "El código no corresponde a ningún hospital."
                                : (error.error || "No se pudo vincular el hospital.");
                            return;
                        }
                    } catch (error) {
                        console.error("No se pudo conectar con el servidor:", error);
                    }
                }

                hospitales.push({
                    id: Date.now(),
                    codigo: codigo,
                    nombre: "Hospital vinculado"
                });

                localStorage.setItem(
                    "hospitalesVinculados",
                    JSON.stringify(hospitales)
                );

                mostrarHospitales();
                formulario.reset();
                mensaje.textContent = "Hospital vinculado correctamente.";
            });

            mostrarHospitales();
        });
    </script>

    <script>
        // ==========================================
        // FOTO DE PERFIL: se muestra en el botón de perfil
        // (es la que se elige en Configuración)
        // ==========================================
        (function () {
            function mostrarFotoPerfil() {
                const foto = localStorage.getItem("fotoPerfil");
                const botonConFoto = document.getElementById("botonPerfil");

                if (!foto || !botonConFoto) {
                    return;
                }

                // "important" para ganarle al color de fondo que tiene el botón en el CSS
                botonConFoto.style.setProperty("background-image", 'url("' + foto + '")', "important");
                botonConFoto.style.setProperty("background-size", "cover", "important");
                botonConFoto.style.setProperty("background-position", "center", "important");
                botonConFoto.style.setProperty("background-repeat", "no-repeat", "important");
                botonConFoto.classList.add("con-foto-perfil");

                // Se oculta el muñequito que está adentro del botón
                Array.from(botonConFoto.children).forEach(function (hijo) {
                    hijo.style.setProperty("display", "none", "important");
                });
            }

            // Se aplica cuando la página terminó de cargar, después del resto del código
            if (document.readyState === "complete") {
                mostrarFotoPerfil();
            } else {
                window.addEventListener("load", mostrarFotoPerfil);
            }
        })();
    </script>

</body>
</html>
