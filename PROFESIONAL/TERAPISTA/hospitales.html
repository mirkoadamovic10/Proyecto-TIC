<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospitales - NeuroPassport</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

</head>


<body>

    <header class="barra-empresa">

        <nav class="menu-empresa">

            <a
                href="terapista.html"
                class="boton-menu-empresa"
            >
                Inicio
            </a>

            <a
                href="pacientes.html"
                class="boton-menu-empresa"
            >
                Pacientes
            </a>

            <a
                href="agenda-terapista.html"
                class="boton-menu-empresa"
            >
                Agenda
            </a>

        </nav>


        <a
            href="configuracion.html"
            class="perfil-empresa"
            title="Configuración"
        >

            <span class="perfil-cabeza"></span>

            <span class="perfil-cuerpo"></span>

        </a>

    </header>


    <main class="empresa-principal">

        <section class="empresa-bienvenida">

            <header>

                <h1>
                    Mis hospitales
                </h1>

                <p>
                    Vinculate con hospitales para trabajar
                    junto a otros profesionales.
                </p>

            </header>

        </section>


        <section class="empresa-info">

            <header>

                <h2>
                    Vincular hospital
                </h2>

            </header>


            <div class="formulario-linkear">

                <div class="campo-linkear">

                    <label for="codigoHospital">

                        Código del hospital

                    </label>


                    <input
                        type="text"
                        id="codigoHospital"
                        placeholder="Ingresá el código del hospital"
                    >

                </div>


                <button
                    type="button"
                    class="boton-linkear"
                    id="botonVincularHospital"
                >

                    Vincular hospital

                </button>

            </div>

        </section>


        <section class="empresa-info">

            <header>

                <h2>
                    Hospitales vinculados
                </h2>

            </header>


            <div
                id="hospitalesVinculados"
                class="lista-pacientes"
            ></div>

        </section>

    </main>


    <script
        src="hospitales.js"
        defer
    ></script>

</body>

</html>
