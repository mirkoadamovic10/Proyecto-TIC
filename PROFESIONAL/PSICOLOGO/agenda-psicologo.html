<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda - NeuroPassport</title>

    <link rel="stylesheet" href="../../style.css">

    <style>
        /* NAVBAR */

        .barra-empresa {
            background: transparent !important;
            background-color: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px 30px;
        }

        .titulo-agenda-navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .titulo-agenda-navbar h1 {
            margin: 0;
            font-size: 30px;
        }

        .titulo-agenda-navbar p {
            margin: 4px 0 0;
            font-size: 15px;
        }

        /* BOTON VOLVER */

        #botonVolver {
            position: absolute;
            left: 30px;
            padding: 8px 13px;
            border: none !important;
            border-radius: 8px;
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            color: #2F7185 !important;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #botonVolver:hover {
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            color: #2F7185 !important;
        }

        /* BOTON AGREGAR EVENTO */

        button#botonAgregarEvento {
            position: absolute;
            right: 30px;
            padding: 11px 20px;
            border: none !important;
            border-radius: 8px;
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            background-image: none !important;
            color: #2F7185 !important;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button#botonAgregarEvento:hover {
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            color: #2F7185 !important;
        }

        /* TARJETA PRINCIPAL */

        .calendario-medico {
            background: #CEE9DA !important;
            background-color: #CEE9DA !important;
        }

        /* BARRA DE MESES TRANSPARENTE */

        .calendario-medico .calendario-cabecera,
        .calendario-medico .calendario-cabecera h2,
        .calendario-medico .calendario-cabecera button {
            background: transparent !important;
            background-color: transparent !important;
            background-image: none !important;
        }

        .calendario-medico .calendario-cabecera::before,
        .calendario-medico .calendario-cabecera::after {
            display: none !important;
            content: none !important;
        }

        /* BARRA GRIS DE LOS DIAS */

        .calendario-semana {
            background-color: #D9D9D9 !important;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 0;
            border-radius: 0;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .calendario-semana div {
            background: transparent !important;
        }

    </style>
</head>

<body>

    <header class="barra-empresa">

        <button
            type="button"
            id="botonVolver"
        >
            ← Volver
        </button>

        <div class="titulo-agenda-navbar">
            <h1>Agenda</h1>

            <p>
                Organizá tus turnos, estudios, terapias y controles médicos.
            </p>
        </div>

        <button
            type="button"
            id="botonAgregarEvento"
            class="boton-agregar-evento"
        >
            + Agregar evento
        </button>

    </header>

    <main class="empresa-principal">

        <section class="calendario-medico">

            <header class="calendario-cabecera">

                <button type="button" id="mesAnterior">‹</button>

                <h2 id="mesActual"></h2>

                <button type="button" id="mesSiguiente">›</button>

            </header>

            <section class="calendario-semana" aria-label="Días de la semana">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
                <div>Dom</div>
            </section>

            <section
                id="calendarioDias"
                class="calendario-dias"
                aria-label="Días del calendario"
            ></section>

        </section>

    </main>

    <section
        id="modalAgenda"
        class="modal-agenda"
        aria-labelledby="tituloModal"
        hidden
    >

        <section class="modal-agenda-contenido">

            <button
                type="button"
                id="cerrarModal"
                class="cerrar-modal-agenda"
                aria-label="Cerrar ventana"
            >
                ×
            </button>

            <header>
                <h2 id="tituloModal">Agregar sesión</h2>
                <p id="fechaSeleccionada"></p>
            </header>

            <form>

                <fieldset class="campo-agenda">
                    <label for="nombrePaciente">Paciente</label>
                    <input
                        type="text"
                        id="nombrePaciente"
                        placeholder="Nombre del paciente"
                    >
                </fieldset>

                <fieldset class="campo-agenda">
                    <label for="horaTurno">Hora</label>
                    <input type="time" id="horaTurno">
                </fieldset>

                <fieldset class="campo-agenda">
                    <label for="motivoConsulta">Motivo de consulta</label>
                    <textarea
                        id="motivoConsulta"
                        placeholder="Escribí el motivo de la consulta"
                    ></textarea>
                </fieldset>

                <fieldset class="campo-agenda">
                    <label for="tipoTurno">Tipo de turno</label>
                    <select id="tipoTurno">
                        <option value="">Seleccioná una opción</option>
                        <option value="primera-consulta">Primera consulta</option>
                        <option value="sesion">Sesión</option>
                        <option value="seguimiento">Seguimiento</option>
                        <option value="control">Control</option>
                    </select>
                </fieldset>

                <button
                    type="button"
                    id="guardarTurno"
                    class="boton-guardar-agenda"
                >
                    Guardar turno
                </button>

            </form>

        </section>

    </section>

    <script src="agenda-psicologo.js" defer></script>

    <script>
        document.getElementById("botonAgregarEvento").addEventListener("click", function () {
            document.getElementById("modalAgenda").hidden = false;
        });

        document.getElementById("botonVolver").addEventListener("click", function () {
            window.history.back();
        });
    </script>

</body>
</html>
