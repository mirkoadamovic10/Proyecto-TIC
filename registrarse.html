<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse - NeuroPassport</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="register-container">

        <section class="register-card">

            <header>

                <h1>
                    Crear una cuenta
                </h1>

            </header>


            <form>


                <!-- ========================= -->
                <!-- NOMBRE -->
                <!-- ========================= -->

                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresá tu nombre"
                    >

                </div>


                <!-- ========================= -->
                <!-- EMAIL -->
                <!-- ========================= -->

                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresá tu correo"
                    >

                </div>


                <!-- ========================= -->
                <!-- CONTRASEÑA -->
                <!-- ========================= -->

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                    >

                </div>


                <!-- ========================= -->
                <!-- ROL PRINCIPAL -->
                <!-- ========================= -->

                <div class="campo">

                    <label for="rol">
                        Rol
                    </label>

                    <select
                        id="rol"
                        name="rol"
                    >

                        <option value="">
                            Seleccioná tu rol
                        </option>

                        <option value="personal">
                            Personal
                        </option>

                        <option value="familia">
                            Familia
                        </option>

                        <option value="hospital">
                            Hospital
                        </option>

                        <option value="institucion">
                            Institución
                        </option>

                        <option value="profesional">
                            Profesional
                        </option>

                    </select>

                </div>


                <!-- ========================= -->
                <!-- TIPO DE INSTITUCIÓN -->
                <!-- ========================= -->

                <div
                    class="campo"
                    id="contenedorTipoInstitucion"
                    style="display: none;"
                >

                    <label for="tipoInstitucion">
                        Tipo de institución
                    </label>

                    <select
                        id="tipoInstitucion"
                        name="tipoInstitucion"
                    >

                        <option value="">
                            Seleccioná una opción
                        </option>

                        <option value="escuela">
                            Escuela / Universidad
                        </option>

                        <option value="empresa">
                            Empresa
                        </option>

                    </select>

                </div>


                <!-- ========================= -->
                <!-- TIPO DE PROFESIONAL -->
                <!-- ========================= -->

                <div
                    class="campo"
                    id="contenedorTipoProfesional"
                    style="display: none;"
                >

                    <label for="tipoProfesional">
                        Tipo de profesional
                    </label>

                    <select
                        id="tipoProfesional"
                        name="tipoProfesional"
                    >

                        <option value="">
                            Seleccioná una opción
                        </option>

                        <option value="medico">
                            Médico
                        </option>

                        <option value="terapista">
                            Terapista ocupacional / kinesiólogo
                        </option>

                        <option value="psicologo">
                            Psicólogo / Psiquiatra
                        </option>

                        <option value="empleado">
                            Empleado
                        </option>

                    </select>

                </div>


                <!-- ========================= -->
                <!-- BOTÓN -->
                <!-- ========================= -->

                <footer>

                    <button
                        type="button"
                        class="register-button"
                    >
                        Registrarse
                    </button>

                </footer>


            </form>

        </section>

    </main>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="registrarse.js"></script>

</body>

</html>
