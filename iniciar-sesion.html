<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - NeuroPassport</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card" aria-labelledby="titulo-login">

            <header>
                <h1 id="titulo-login">Bienvenido de vuelta</h1>
            </header>

            <form>

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresá tu usuario"
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                    >
                </div>

                <footer>
                    <button
                        class="login-button"
                        type="submit"
                    >
                        Iniciar sesión
                    </button>
                </footer>

            </form>

        </section>

    </main>

    <script src="iniciar-sesion.js" defer></script>

</body>

</html>
