<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobertura médica - NeuroPassport</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body data-tipo="cobertura" data-nombre="Cobertura médica">

    <header class="barra-personal">
        <h2>NeuroPassport</h2>
    </header>

    <main class="pasaporte-pagina">

        <div class="pasaporte-contenido">

            <h1 class="pasaporte-titulo">Cobertura médica</h1>

            <p class="pasaporte-descripcion">
                Información sobre cobertura médica.
            </p>

            <section class="agregar-seccion">

                <h3>Agregar cobertura</h3>

                <p>Ingresá una nueva cobertura médica.</p>

                <button class="boton-agregar" id="botonAgregar">
                    + Agregar cobertura
                </button>

                <div class="formulario-agregar" id="formularioAgregar">
                    <div id="formularioContenido"></div>
                </div>

            </section>

            <section class="informacion-guardada">

                <h3>Coberturas guardadas</h3>

                <div class="lista-items" id="listaItems"></div>

            </section>

        </div>

    </main>

    <script src="pasaporte.js"></script>

</body>

</html>
