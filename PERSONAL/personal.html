<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuroPassport - Inicio</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="barra-personal">

        <nav class="menu-personal" aria-label="Menú principal">

            <a href="./personal.html" class="boton-menu">
                Inicio
            </a>

            <section class="contenedor-pasaporte">

                <button
                    type="button"
                    class="boton-menu"
                    id="botonPasaporte"
                    aria-expanded="false"
                    aria-controls="submenuPasaporte">
                    Pasaporte
                </button>

                <nav
                    id="submenuPasaporte"
                    class="submenu-pasaporte"
                    hidden
                    aria-label="Opciones del pasaporte">

                    <button type="button" class="boton-pasaporte">
                        Diagnósticos
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Medicación
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Alergias
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Estudios
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Terapias
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Cirugías
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Contactos
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Cobertura médica
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Certificados
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Adaptaciones
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Objetivos
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Preferencias de aprendizaje
                    </button>

                    <button type="button" class="boton-pasaporte">
                        Formas de comunicación
                    </button>

                </nav>

            </section>

            <a href="./agenda.html" class="boton-menu">
                Agenda
            </a>

        </nav>

        <aside>

            <div class="contenedor-perfil">

                <button
                    type="button"
                    class="perfil"
                    aria-label="Perfil"
                    id="botonPerfil">

                    <span class="cabeza"></span>
                    <span class="cuerpo"></span>

                </button>

                <div
                    class="submenu-perfil"
                    id="submenuPerfil">

                    <button
                        type="button"
                        data-pagina="configuracion.html">
                        Configuración
                    </button>

                    <button
                        type="button"
                        data-pagina="informacion-personal.html">
                        Información personal
                    </button>

                </div>

            </div>

        </aside>

    </header>

    <main class="inicio-personal">

        <section
            class="contenido-inicio"
            aria-label="Página de inicio">

            <h1 id="saludoUsuario">
                ¡Hola! Bienvenido a NeuroPassport
            </h1>

            <figure
                class="ilustracion-pasaporte"
                aria-label="Ilustración de un pasaporte">

                <div class="pasaporte-dibujo">

                    <div class="pasaporte-tapa">

                        <span class="texto-pasaporte">
                            PASSPORT
                        </span>

                        <span class="globo-pasaporte">

                            <span class="linea-horizontal"></span>

                            <span class="linea-vertical"></span>

                            <span class="linea-curva-1"></span>

                            <span class="linea-curva-2"></span>

                        </span>

                    </div>

                </div>

            </figure>

        </section>

    </main>

    <script src="./personal.js"></script>

</body>

</html>
