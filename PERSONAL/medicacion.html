<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicación - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #F1FAEE !important;
            font-family: "Inter", Arial, sans-serif;
        }

        /* ============================= */
        /* NAVBAR                        */
        /* ============================= */

        body > header.barra-personal {
            width: 100%;
            min-height: 75px;
            padding: 13px 5%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            background: #8A7090 !important;
            background-image: none !important;
            border: none !important;
            box-shadow: none !important;
            position: relative;
            z-index: 100;
        }

        .nombre-neuropassport {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            margin: 0;
            color: #D9E2E3;
            font-size: 30px;
            font-weight: 700;
        }

        body > header.barra-personal .menu-personal {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 0;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        body > header.barra-personal .menu-personal > .boton-menu {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 15px;
            background: #CDB4DB !important;
            color: #000000 !important;
            border: 1px solid #CDB4DB;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            text-decoration: none;
            cursor: pointer;
        }

        body > header.barra-personal .menu-personal > .boton-menu:hover {
            background: #BFA0D0 !important;
            color: #000000 !important;
        }

        /* Campana */
        .logo-menu {
            width: 32px;
            height: 37px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        .boton-notificaciones {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-decoration: none;
            cursor: pointer;
        }

        /* Perfil */
        .contenedor-perfil {
            position: relative;
            margin: 0;
            padding: 0;
        }

        body > header.barra-personal .perfil {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
        }

        .perfil-cabeza {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: #111111;
            margin-bottom: 3px;
        }

        .perfil-cuerpo {
            width: 20px;
            height: 10px;
            border-radius: 10px 10px 5px 5px;
            background-color: #111111;
        }

        .imagen-perfil {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        body > header.barra-personal .submenu-perfil {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            width: 280px;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            gap: 12px;
            list-style: none;
            background: #FFFFFF;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            z-index: 200;
        }

        body > header.barra-personal .submenu-perfil.activo {
            display: flex;
        }

        body > header.barra-personal .submenu-perfil li {
            margin: 0;
            padding: 0;
        }

        body > header.barra-personal .submenu-perfil button {
            width: 100%;
            min-height: 65px;
            padding: 16px 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E1E8E9;
            color: #2F7185;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        body > header.barra-personal .submenu-perfil button:hover {
            background: #CCDDE0;
            transform: translateY(-2px);
        }

        /* ============================= */
        /* MODAL PASAPORTE               */
        /* ============================= */

        .modal-pasaporte {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            border: none;
            background: rgba(0, 0, 0, 0.35);
        }

        .modal-pasaporte[hidden] {
            display: none !important;
        }

        .panel-pasaporte {
            position: relative;
            width: 100%;
            max-width: 850px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 35px;
            box-sizing: border-box;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
        }

        .panel-pasaporte h2 {
            margin: 0 40px 8px;
            color: #2F7185;
            font-size: 28px;
            text-align: center;
        }

        .descripcion-pasaporte {
            margin: 0 0 28px;
            color: #555555;
            font-size: 15px;
            text-align: center;
        }

        .opciones-pasaporte {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .opciones-pasaporte li {
            margin: 0;
            padding: 0;
        }

        .opciones-pasaporte .boton-pasaporte {
            width: 100%;
            height: 100%;
            min-height: 85px;
            padding: 18px 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E1E8E9;
            color: #2F7185;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .opciones-pasaporte .boton-pasaporte:hover {
            background: #CCDDE0;
            transform: translateY(-2px);
        }

        .cerrar-pasaporte {
            position: absolute;
            top: 15px;
            right: 18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #2F7185;
            border: none;
            border-radius: 50%;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
        }

        .cerrar-pasaporte:hover {
            background: #E1E8E9;
        }

        /* Botones del navbar como en el diseño */
        body > header.barra-personal .menu-personal > .boton-menu {
            padding: 9px 24px;
            font-size: 19px;
            font-weight: 500;
        }

        .nombre-neuropassport {
            font-weight: 500;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ============================= */
        /* OPCIÓN DEL PASAPORTE          */
        /* ============================= */

        main.popc-principal {
            display: block;
            padding: 22px 6% 50px !important;
            box-sizing: border-box;
            text-align: left !important;
            animation: none !important;
        }

        .popc-atras {
            display: inline-flex !important;
            align-items: center;
            gap: 5px;
            margin: 0 0 0 calc(-6% + 8px);
            padding: 5px 8px !important;
            background: #B7E4C7 !important;
            color: #2F7185 !important;
            border: none !important;
            border-radius: 8px !important;
            font-family: inherit;
            font-size: 11px !important;
            font-weight: 500 !important;
            cursor: pointer;
        }

        .popc-cabecera {
            margin: 22px 0 40px;
            text-align: center;
        }

        .popc-cabecera h1 {
            margin: 0 !important;
            color: #2F7185 !important;
            font-size: 36px !important;
            font-weight: 700 !important;
            letter-spacing: normal !important;
            line-height: 1.15 !important;
        }

        .popc-cabecera p {
            margin: 2px 0 0;
            color: #2F7185;
            font-size: 17px;
            font-weight: 500;
        }

        .popc-tarjeta {
            width: 100%;
            max-width: 905px;
            margin: 0 auto;
            box-sizing: border-box;
            border-radius: 13px;
            text-align: center;
        }

        .popc-tarjeta h2 {
            margin: 0 !important;
            color: #2F7185 !important;
            font-size: 23px !important;
            font-weight: 600 !important;
            letter-spacing: normal !important;
            line-height: 1.2 !important;
        }

        /* Tarjeta verde: agregar */

        .popc-agregar {
            padding: 40px 30px 52px;
            background: #CEE9DA;
        }

        .popc-agregar > hgroup p {
            margin: 6px 0 0;
            color: #2F7185;
            font-size: 13px;
            font-weight: 500;
        }

        .popc-boton-agregar {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 250px;
            height: 57px;
            margin: 32px 0 0;
            padding: 0 26px !important;
            background: #2F7185 !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 10px !important;
            font-family: inherit;
            font-size: 16px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .popc-boton-agregar:hover {
            background: #285F70 !important;
        }

        .popc-mas {
            font-size: 30px;
            font-weight: 300;
            line-height: 1;
        }

        /* Formulario que se despliega (lo arma pasaporte.js) */

        .popc-agregar .formulario-agregar {
            display: none !important;
            max-width: 620px;
            margin: 28px auto 0 !important;
            padding: 24px 26px !important;
            box-sizing: border-box;
            background: #FFFFFF !important;
            border: none !important;
            border-radius: 12px !important;
            box-shadow: none !important;
            text-align: left;
        }

        .popc-agregar .formulario-agregar.visible {
            display: block !important;
        }

        .popc-agregar .formulario-agregar .campo {
            display: flex;
            flex-direction: column;
            margin: 0 0 16px !important;
            padding: 0;
            background: transparent !important;
        }

        .popc-agregar .formulario-agregar label {
            margin: 0 0 7px !important;
            color: #2F7185 !important;
            font-size: 15px !important;
            font-weight: 600 !important;
        }

        .popc-agregar .formulario-agregar input,
        .popc-agregar .formulario-agregar textarea {
            width: 100% !important;
            margin: 0 !important;
            padding: 10px 13px !important;
            box-sizing: border-box;
            background: #F4F6F5 !important;
            border: 1px solid #DCE5DF !important;
            border-radius: 8px !important;
            box-shadow: none !important;
            color: #333333 !important;
            font-family: inherit;
            font-size: 14px !important;
        }

        .popc-agregar .formulario-agregar textarea {
            min-height: 90px;
            resize: vertical;
        }

        .popc-agregar .formulario-agregar .guardar-item {
            display: block;
            min-width: 150px;
            height: 40px;
            margin: 6px auto 0 !important;
            padding: 0 20px !important;
            background: #2F7185 !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 8px !important;
            font-family: inherit;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        /* Tarjeta blanca: guardados */

        .popc-guardados {
            margin-top: 27px;
            padding: 46px 30px 64px;
            background: #FFFFFF;
        }

        .popc-guardados .lista-items {
            display: flex !important;
            flex-direction: column;
            gap: 12px;
            max-width: 770px;
            margin: 36px auto 0 !important;
            padding: 0 !important;
        }

        /* Mensaje "Todavía no hay información agregada." */
        .popc-guardados .lista-items > div {
            padding: 18px 20px;
            background: #F7F7F7;
            border: 1px dashed #8C8C8C;
            border-radius: 9px;
            color: #8C8C8C;
            font-size: 16px;
            text-align: center;
        }

        .popc-guardados .item-guardado {
            margin: 0 !important;
            padding: 16px 20px !important;
            background: #F7FBF8 !important;
            border: 1px solid #D5EBDC !important;
            border-radius: 9px !important;
            box-shadow: none !important;
            text-align: left;
            transform: none !important;
        }

        .popc-guardados .item-guardado p {
            margin: 0 0 4px !important;
            color: #333333 !important;
            font-size: 14px !important;
        }

        .popc-guardados .item-guardado p:last-child {
            margin: 6px 0 0 !important;
            color: #8C8C8C !important;
            font-size: 12px !important;
        }

        .popc-guardados .item-guardado strong {
            color: #2F7185;
        }

        /* ============================= */
        /* RESPONSIVE                    */
        /* ============================= */

        @media (max-width: 700px) {
            .opciones-pasaporte {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 600px) {
            body > header.barra-personal {
                padding: 15px 4%;
                flex-wrap: wrap;
            }

            body > header.barra-personal .menu-personal {
                flex-wrap: wrap;
                gap: 10px;
            }

            body > header.barra-personal .menu-personal > .boton-menu {
                padding: 8px 10px;
                font-size: 13px;
            }

            body > header.barra-personal .submenu-perfil {
                width: 250px;
                padding: 15px;
            }

            main.popc-principal {
                padding: 20px 4% 40px !important;
            }

            .popc-atras {
                margin-left: 0;
            }

            .popc-cabecera h1 {
                font-size: 28px !important;
            }

            .popc-agregar,
            .popc-guardados {
                padding: 28px 16px 36px;
            }

            .popc-boton-agregar {
                min-width: 0;
                width: 100%;
            }
        }

        /* ============================= */
        /* FOTO DE PERFIL EN EL BOTÓN    */
        /* (la que se elige en Configuración) */
        /* ============================= */

        .con-foto-perfil {
            padding: 0 !important;
            overflow: hidden !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        /* Con foto se oculta el muñequito */
        .con-foto-perfil > * {
            display: none !important;
        }
    </style>
</head>

                class="perfil"
                aria-label="Perfil"

                aria-expanded="false"
                aria-controls="submenuPerfil">

                <span class="perfil-cabeza"></span>
                <span class="perfil-cuerpo"></span>

            </button>

            <menu
                class="submenu-perfil"
                id="submenuPerfil">

                <li>
                    <button type="button" data-pagina="configuracion.html">

                <li>
                    <button type="button" data-pagina="informacion-personal.html">

    </header>

    <dialog
        id="submenuPasaporte"
        class="modal-pasaporte"
        aria-modal="true"
        aria-labelledby="tituloPasaporte"
        open
        hidden>

        <section class="panel-pasaporte">

            <button
                type="button"
                class="cerrar-pasaporte"
                id="cerrarPasaporte"
                aria-label="Cerrar menú">
                &times;
            </button>

            <h2 id="tituloPasaporte">Mi Pasaporte</h2>

            <p class="descripcion-pasaporte">
                Seleccioná una opción
            </p>

            <ul class="opciones-pasaporte">
                <li><button type="button" class="boton-pasaporte">Diagnósticos</button></li>
                <li><button type="button" class="boton-pasaporte">Medicación</button></li>
                <li><button type="button" class="boton-pasaporte">Alergias</button></li>
                <li><button type="button" class="boton-pasaporte">Estudios</button></li>
                <li><button type="button" class="boton-pasaporte">Terapias</button></li>
                <li><button type="button" class="boton-pasaporte">Cirugías</button></li>
                <li><button type="button" class="boton-pasaporte">Contactos</button></li>
                <li><button type="button" class="boton-pasaporte">Cobertura médica</button></li>
                <li><button type="button" class="boton-pasaporte">Certificados</button></li>
                <li><button type="button" class="boton-pasaporte">Adaptaciones</button></li>
                <li><button type="button" class="boton-pasaporte">Objetivos</button></li>
                <li><button type="button" class="boton-pasaporte">Preferencias de aprendizaje</button></li>
                <li><button type="button" class="boton-pasaporte">Formas de comunicación</button></li>
            </ul>

        </section>

    </dialog>

    <main class="popc-principal">

        <button type="button" id="botonAtrasOpcion" class="popc-atras">
            <span aria-hidden="true">⟵</span> Volver
        </button>

        <hgroup class="popc-cabecera">
            <h1>Medicación</h1>
            <p>Tu información sobre medicación y tratamientos</p>
        </hgroup>

        <section class="popc-tarjeta popc-agregar" aria-labelledby="tituloAgregar">

            <hgroup class="popc-encabezado">
                <h2 id="tituloAgregar">Agregar medicación</h2>
                <p>Tu información sobre medicación y tratamientos</p>
            </hgroup>

            <button type="button" id="botonAgregar" class="popc-boton-agregar" aria-controls="formularioAgregar">
                <span class="popc-mas" aria-hidden="true">+</span>
                Agregar medicación
            </button>

            <form id="formularioAgregar" class="formulario-agregar" aria-label="Agregar medicación">
                <fieldset id="formularioContenido" style="border: none; margin: 0; padding: 0; min-width: 0;"></fieldset>
            </form>

        </section>

        <section class="popc-tarjeta popc-guardados" aria-labelledby="tituloGuardados">

            <h2 id="tituloGuardados">Medicación guardada</h2>

            <section id="listaItems" class="lista-items" aria-live="polite"></section>

        </section>

    </main>
