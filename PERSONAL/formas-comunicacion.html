<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de comunicación - NeuroPassport</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-tipo="comunicacion" data-nombre="Formas de comunicación">

    <header class="barra-personal">
        <h2>NeuroPassport</h2>
    </header>

    <main class="pasaporte-pagina">

        <div class="pasaporte-contenido">

            <h1 class="pasaporte-titulo">Formas de comunicación</h1>

            <p class="pasaporte-descripcion">
                Formas de comunicación y necesidades específicas.
            </p>

            <section class="agregar-seccion">

                <h3>Agregar forma de comunicación</h3>

                <p>Ingresá una nueva forma de comunicación.</p>

                <button class="boton-agregar" id="botonAgregar">
                    + Agregar forma de comunicación
                </button>

                <div class="formulario-agregar" id="formularioAgregar">
                    <div id="formularioContenido"></div>
                </div>

            </section>

            <section class="informacion-guardada">

                <h3>Formas de comunicación guardadas</h3>

                <div class="lista-items" id="listaItems"></div>

            </section>

        </div>

    </main>

    <script src="pasaporte.js"></script>

</body>

</html>
