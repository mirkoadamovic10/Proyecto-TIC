<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0 !important;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111111;
        }

        /* BARRA SUPERIOR */

        .usu-barra {
            width: 100%;
            min-height: 80px;
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            padding: 8px 35px !important;
            background: #705E32 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .usu-logo {
            margin: 0 !important;
            color: #D9E2E3 !important;
            font-size: 28px !important;
            font-weight: 700 !important;
        }

        .usu-perfil {
            position: relative;
        }

        .usu-boton-perfil {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 !important;
            border: none !important;
            border-radius: 50% !important;
            background: #D9D9D9 !important;
            cursor: pointer;
        }

        .usu-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            width: 210px;
            padding: 7px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .usu-menu.mostrar {
            display: flex;
            flex-direction: column;
        }

        .usu-opcion-menu {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 42px;
            padding: 10px 12px !important;
            border: none !important;
            border-radius: 7px !important;
            background: transparent !important;
            color: #222222 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }

        .usu-opcion-menu:hover {
            background: #F0F8ED !important;
        }

        .usu-separador {
            height: 1px;
            margin: 5px 3px;
            background: #E5E5E5;
        }

        /* CONTENIDO */

        .usu-principal {
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 22px 40px 40px !important;
            text-align: left !important;
        }

        .usu-atras {
            display: inline-flex !important;
            width: auto !important;
            margin: 0 !important;
            align-self: flex-start !important;
            align-items: center;
            gap: 6px;
            padding: 6px 12px !important;
            background: #B7E4C7 !important;
            color: #285866 !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .usu-cabecera {
            width: 100%;
            display: flex !important;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 18px 0 28px;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .usu-cabecera h1 {
            margin: 0 !important;
            color: #000000 !important;
            font-size: 34px !important;
            font-weight: 700 !important;
            text-align: left !important;
        }

        .usu-cabecera p {
            margin: 6px 0 0 !important;
            color: #222222;
            font-size: 14px;
        }

        .usu-boton-agregar {
            padding: 14px 18px !important;
            background: #B7E4C7 !important;
            color: #285866 !important;
            border: none !important;
            border-radius: 10px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .usu-boton-agregar:hover {
            background: #A6D9B8 !important;
        }

        /* LISTA DE USUARIOS */

        .usu-lista {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .usu-lista li {
            margin: 0;
            padding: 0;
        }

        .usu-tarjeta {
            width: 100%;
            min-height: 66px;
            display: flex !important;
            align-items: center;
            gap: 16px;
            padding: 8px 14px !important;
            background: #FFFFFF !important;
            color: #111111 !important;
            border: 1px solid #DDEFE0 !important;
            border-radius: 8px !important;
            box-shadow: none !important;
            text-align: left;
            cursor: pointer;
        }

        .usu-tarjeta:hover {
            border-color: #A6D9B8 !important;
            background: #FAFDF9 !important;
        }

        .usu-avatar {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #D9D9D9;
            color: #555555;
            font-size: 15px;
            font-weight: 600;
        }

        .usu-datos {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .usu-datos strong {
            font-size: 16px;
            font-weight: 600;
        }

        .usu-datos span {
            color: #5E6B66;
            font-size: 13px;
        }

        .usu-vacio {
            margin: 10px 0 0;
            color: #5E6B66;
            font-size: 15px;
            text-align: center;
        }

        /* VENTANA PARA LINKEAR */

        .usu-ventana {
            width: min(420px, calc(100% - 40px));
            padding: 28px 28px 24px;
            border: none;
            border-radius: 14px;
            background: #FFFFFF;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .usu-ventana::backdrop {
            background: rgba(0, 0, 0, 0.35);
        }

        .usu-ventana h2 {
            margin: 0 0 6px !important;
            color: #2F7185 !important;
            font-size: 22px !important;
            font-weight: 700 !important;
            text-align: center;
        }

        .usu-ventana > p {
            margin: 0 0 18px;
            color: #444444;
            font-size: 14px;
            text-align: center;
        }

        .usu-cerrar {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 32px;
            height: 32px;
            padding: 0 !important;
            background: transparent !important;
            color: #555555 !important;
            border: none !important;
            font-size: 24px !important;
            cursor: pointer;
        }

        .usu-formulario {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .usu-formulario label {
            color: #2F7185;
            font-size: 14px;
            font-weight: 600;
        }

        .usu-formulario input {
            width: 100% !important;
            height: 42px !important;
            margin: 0 0 8px !important;
            padding: 0 14px !important;
            background: #F4F6F5 !important;
            border: 1px solid #E1E6E3 !important;
            border-radius: 8px !important;
            color: #222222 !important;
            font-size: 14px !important;
            box-shadow: none !important;
        }

        .usu-guardar {
            margin-top: 6px;
            padding: 12px !important;
            background: #2F7185 !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .usu-mensaje {
            display: block;
            min-height: 18px;
            margin-top: 12px;
            color: #2F7185;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .usu-principal {
                padding: 18px 16px 30px !important;
            }

            .usu-cabecera {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header class="usu-barra">
        <h2 class="usu-logo">NeuroPassport</h2>

        <div class="usu-perfil">
            <button
                type="button"
                class="usu-boton-perfil"
                id="botonPerfil"
                aria-label="Abrir menú de perfil"
                aria-expanded="false"
                aria-controls="menuPerfil">

                <svg viewBox="0 0 24 24" width="32" height="32" fill="#000000" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                </svg>
            </button>

            <nav class="usu-menu" id="menuPerfil" aria-label="Menú de perfil">
                <a href="configuracion.html" class="usu-opcion-menu">Configuración</a>
                <a href="informacion-personal.html" class="usu-opcion-menu">Información personal</a>
                <div class="usu-separador"></div>
                <button type="button" class="usu-opcion-menu" id="botonCerrarSesion">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <main class="usu-principal">

        <button type="button" class="usu-atras" id="botonAtras">
            <span aria-hidden="true">←</span>
            Volver
        </button>

        <section class="usu-cabecera">
            <div>
                <h1>Usuarios</h1>
                <p>Usuarios vinculados a esta institución.</p>
            </div>

            <button type="button" class="usu-boton-agregar" id="botonLinkearUsuario">
                + Linkear usuario
            </button>
        </section>

        <ul class="usu-lista" id="listaUsuarios" aria-label="Usuarios vinculados"></ul>

        <p class="usu-vacio" id="sinUsuarios" hidden>
            Todavía no hay usuarios vinculados.
        </p>

    </main>

    <dialog class="usu-ventana" id="ventanaUsuario" aria-labelledby="tituloVentanaUsuario">

        <button type="button" class="usu-cerrar" id="cerrarVentanaUsuario" aria-label="Cerrar">×</button>

        <h2 id="tituloVentanaUsuario">Linkear usuario</h2>
        <p>Ingresá los datos del profesional que querés vincular.</p>

        <form class="usu-formulario" id="formularioUsuario">

            <label for="nombreUsuarioVincular">Nombre y apellido</label>
            <input
                type="text"
                id="nombreUsuarioVincular"
                autocomplete="off"
                placeholder="Ej.: Ana Pérez">

            <label for="codigoUsuarioVincular">Código del usuario</label>
            <input
                type="text"
                id="codigoUsuarioVincular"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Número de usuario en NeuroPassport"
                required>

            <button type="submit" class="usu-guardar">Linkear usuario</button>
        </form>

        <output class="usu-mensaje" id="mensajeUsuario" aria-live="polite"></output>

    </dialog>

    <script src="usuarios-escuela.js"></script>

</body>

</html>
