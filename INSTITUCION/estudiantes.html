<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        /* NAVBAR */

        .barra-empresa {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 24px;
            background: #705E32 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .texto-navbar {
            color: #D9E2E3;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* BOTÓN DE PERFIL */

        .contenedor-perfil {
            position: relative;
        }

        .boton-perfil-empresa {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #D9E2E3;
            cursor: pointer;
            transform: none !important;
            transition: none !important;
        }

        .boton-perfil-empresa:hover,
        .boton-perfil-empresa:focus,
        .boton-perfil-empresa:active {
            background: #D9E2E3 !important;
            transform: none !important;
            transition: none !important;
        }

        .icono-perfil {
            position: relative;
            width: 26px;
            height: 26px;
        }

        .icono-perfil::before {
            content: "";
            position: absolute;
            top: 0;
            left: 7px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #000000;
        }

        .icono-perfil::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 2px;
            width: 22px;
            height: 11px;
            border-radius: 10px 10px 5px 5px;
            background: #000000;
        }

        /* DESPLEGABLE DEL PERFIL */

        .menu-perfil {
            display: none;
            position: absolute;
            top: 58px;
            right: 0;
            width: 210px;
            padding: 7px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.13);
            z-index: 1000;
        }

        .menu-perfil.mostrar {
            display: flex;
            flex-direction: column;
        }

        .opcion-perfil {
            width: 100%;
            padding: 12px 13px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #222;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: none !important;
            transform: none !important;
        }

        .opcion-perfil:hover {
            background: #F0F8ED !important;
            color: #285866 !important;
            transform: none !important;
        }

        .opcion-cerrar-sesion {
            color: #222;
        }

        .opcion-cerrar-sesion:hover {
            background: #F0F8ED !important;
            color: #285866 !important;
        }

        /* CONTENIDO */

        .empresa-principal {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 58px 20px 40px;
        }

        /* BOTÓN VOLVER */

        .boton-volver {
            width: 85px;
            min-width: 85px;
            height: 36px;
            min-height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin: 0 0 25px -15px;
            padding: 0 8px;
            border: none;
            border-radius: 10px;
            background: #B7E4C7 !important;
            color: #285866;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: none;
            transform: none !important;
            transition: none !important;
        }

        .boton-volver:hover {
            background: #B7E4C7 !important;
            transform: none !important;
        }

        .flecha-volver {
            font-size: 16px;
            line-height: 1;
        }

        .empresa-bienvenida {
            width: 100%;
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            gap: 20px;
            margin: 0 0 26px !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .empresa-bienvenida header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .empresa-bienvenida h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 48px !important;
            line-height: 1.2 !important;
            font-weight: 700 !important;
            color: #111 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .empresa-bienvenida p {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 20px !important;
            line-height: 1.5 !important;
            color: #222 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* BOTÓN LINKEAR ESTUDIANTE */

        .boton-agregar-hospital {
            flex: 0 0 209px;
            width: 209px !important;
            min-width: 209px !important;
            height: 61px !important;
            min-height: 61px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 !important;
            padding: 0 12px !important;
            border: none !important;
            border-radius: 15px !important;
            background: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: none !important;
            position: static !important;
        }

        .boton-agregar-hospital:hover {
            background: #B7E4C7 !important;
        }

        /* LISTA DE ESTUDIANTES */

        .lista-hospital {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch;
            gap: 7px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .tarjeta-hospital {
            width: 100% !important;
            min-height: 58px !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-start;
            gap: 13px !important;
            margin: 0 !important;
            padding: 9px 14px !important;
            background: #FFFFFF !important;
            border: 1px solid #D6E9D9 !important;
            border-radius: 6px !important;
            box-shadow: none !important;
        }

        .avatar-medico {
            flex: 0 0 42px !important;
            width: 42px !important;
            height: 42px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50% !important;
            background: #D9D9D9 !important;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar-medico img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .datos-medico {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
        }

        .datos-medico h2 {
            margin: 0 !important;
            padding: 0 !important;
            color: #111 !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            overflow-wrap: anywhere;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .datos-medico p,
        .datos-medico .estado-vinculado {
            margin: 0 !important;
            padding: 0 !important;
            color: #555 !important;
            font-size: 12px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .mensaje-vacio {
            margin: 0;
            padding: 0;
            color: #444;
            font-size: 16px !important;
            line-height: 1.5;
        }

        /* BOTÓN DE PREFERENCIAS */

        .boton-preferencias {
            margin-left: auto;
            padding: 8px 13px;
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            background: #B7E4C7;
            color: #285866;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .boton-preferencias:hover {
            background: #A5D9B8;
        }

        /* VENTANA DE VINCULACIÓN */

        .ventana-hospital {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.38);
        }

        .ventana-hospital.mostrar {
            display: flex !important;
        }

        .formulario-hospital {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #D6E9D9 !important;
            border-radius: 15px;
            background: #FFFFFF !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12) !important;
        }

        .formulario-hospital header {
            margin: 0 0 22px;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .formulario-hospital h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .formulario-hospital header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .cerrar-hospital {
            position: absolute;
            top: 12px;
            right: 16px;
            padding: 0;
            border: none !important;
            background: transparent !important;
            color: #555 !important;
            font-size: 28px;
            cursor: pointer;
            box-shadow: none !important;
        }

        .formulario-hospital form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formulario-hospital label {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .formulario-hospital input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #CBDDD0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #111;
            font: inherit;
            font-size: 13px;
        }

        .formulario-hospital input:focus {
            outline: 2px solid #B7E4C7;
            border-color: #77B894;
        }

        .boton-guardar-hospital {
            margin-top: 12px;
            padding: 12px 14px;
            border: none !important;
            border-radius: 8px;
            background: #785D2A !important;
            color: #FFFFFF !important;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
        }

        .mensaje-hospital {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .barra-empresa {
                padding: 8px 10px;
            }

            .empresa-principal {
                padding: 38px 14px 30px;
            }

            .empresa-bienvenida {
                flex-wrap: wrap;
                gap: 16px;
            }

            .empresa-bienvenida h1 {
                font-size: 48px !important;
            }

            .empresa-bienvenida p {
                font-size: 20px !important;
            }

            .boton-agregar-hospital {
                width: 209px !important;
                min-width: 209px !important;
                height: 61px !important;
                min-height: 61px !important;
                flex-basis: 209px;
            }

            .tarjeta-hospital {
                flex-wrap: wrap;
            }

            .boton-preferencias {
                margin-left: 55px;
            }
        }

        /* FORZAR EL COLOR EXACTO DE LOS DOS BOTONES */

        button.boton-volver,
        button.boton-agregar-hospital {
            background-color: #B7E4C7 !important;
            background: #B7E4C7 !important;
            border: none !important;
        }

        button.boton-volver:hover,
        button.boton-agregar-hospital:hover {
            background-color: #B7E4C7 !important;
            background: #B7E4C7 !important;
        }
    </style>
</head>

<body>

    <header class="barra-empresa">
        <p class="texto-navbar">NeuroPassport</p>

        <div class="contenedor-perfil">

            <button
                type="button"
                class="boton-perfil-empresa"
                id="botonPerfil"
                aria-label="Perfil"
                aria-expanded="false"
                aria-controls="menuPerfil">
                <span class="icono-perfil"></span>
            </button>

            <nav class="menu-perfil" id="menuPerfil">

                <button type="button" class="opcion-perfil">
                    Configuración
                </button>

                <button type="button" class="opcion-perfil">
                    Información personal
                </button>

                <button type="button" class="opcion-perfil opcion-cerrar-sesion">
                    Cerrar sesión
                </button>

            </nav>

        </div>
    </header>

    <main class="empresa-principal">

        <button type="button" class="boton-volver" onclick="history.back()">
            <span class="flecha-volver">←</span>
            Volver
        </button>

        <section class="empresa-bienvenida">
            <header>
                <h1>Estudiantes</h1>
                <p>Estudiantes vinculados a esta institución.</p>
            </header>

            <button
                type="button"
                id="botonLinkearEstudiante"
                class="boton-agregar-hospital">
                + Linkear estudiante
            </button>
        </section>

        <section
            id="estudiantesVinculados"
            class="lista-hospital"
            aria-label="Estudiantes vinculados">
        </section>

    </main>

    <!-- VENTANA PARA LINKEAR ESTUDIANTE -->

    <aside
        id="ventanaEstudiante"
        class="ventana-hospital"
        aria-hidden="true">

        <section
            class="formulario-hospital"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloVinculacionEstudiante">

            <button
                type="button"
                id="cerrarModalEstudiante"
                class="cerrar-hospital"
                aria-label="Cerrar">
                ×
            </button>

            <header>
                <h2 id="tituloVinculacionEstudiante">Linkear estudiante</h2>
                <p>Ingresá los datos del estudiante que querés vincular.</p>
            </header>

            <form id="formularioEstudiante">

                <label for="nombreEstudiante">Nombre y apellido</label>
                <input
                    type="text"
                    id="nombreEstudiante"
                    autocomplete="name"
                    placeholder="Ej.: Ana Pérez"
                    required>

                <label for="dniEstudiante">DNI</label>
                <input
                    type="text"
                    id="dniEstudiante"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Ingresá el DNI"
                    required>

                <label for="codigoEstudiante">Código del estudiante</label>
                <input
                    type="text"
                    id="codigoEstudiante"
                    autocomplete="off"
                    placeholder="Ingresá el código"
                    required>

                <button
                    type="submit"
                    id="guardarEstudiante"
                    class="boton-guardar-hospital">
                    Enviar solicitud
                </button>

            </form>

            <output
                id="mensajeEstudiante"
                class="mensaje-hospital"
                aria-live="polite">
            </output>

        </section>
    </aside>

    <script>
        // DESPLEGABLE DEL PERFIL

        const botonPerfil = document.getElementById("botonPerfil");
        const menuPerfil = document.getElementById("menuPerfil");

        botonPerfil.addEventListener("click", function (event) {
            event.stopPropagation();

            menuPerfil.classList.toggle("mostrar");

            const estaAbierto = menuPerfil.classList.contains("mostrar");
            botonPerfil.setAttribute("aria-expanded", estaAbierto);
        });

        document.addEventListener("click", function (event) {
            if (!menuPerfil.contains(event.target) && !botonPerfil.contains(event.target)) {
                menuPerfil.classList.remove("mostrar");
                botonPerfil.setAttribute("aria-expanded", "false");
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                menuPerfil.classList.remove("mostrar");
                botonPerfil.setAttribute("aria-expanded", "false");
            }
        });
    </script>

    <script src="estudiantes.js" defer></script>

</body>
</html>
