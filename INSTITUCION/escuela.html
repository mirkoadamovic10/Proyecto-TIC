
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroPassport - Escuela / Universidad</title>

    <style>
        /* Configuración general */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f1f7f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Navbar superior */
        .navbar-escuela {
            display: flex;
            width: 100%;
            height: 80px;
            background-color: #785d2a;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
        }

        /* Título NeuroPassport arriba a la izquierda */
        .nombre-neuropassport-escuela {
            color: #ffffff;
            font-size: 38px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Perfil circular a la derecha */
        .perfil-escuela {
            width: 44px;
            height: 44px;
            border: 3px solid #d9e2e3;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            box-sizing: border-box;
            background: transparent;
            text-decoration: none;
        }

        .perfil-escuela .perfil-cabeza {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #d9e2e3;
            margin-bottom: 2px;
        }

        .perfil-escuela .perfil-cuerpo {
            width: 23px;
            height: 13px;
            border-radius: 12px 12px 0 0;
            background: #d9e2e3;
        }

        /* Sección principal Estudiantes */
        .estudiantes-contenedor {
            padding: 40px 60px;
            box-sizing: border-box;
        }

        .estudiantes-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .estudiantes-titulo-box h1 {
            font-size: 36px;
            font-weight: 700;
            color: #000000;
            margin: 0 0 10px 0;
        }

        .estudiantes-titulo-box p {
            font-size: 16px;
            color: #333333;
            margin: 0;
        }

        .btn-linkear-estudiante {
            background-color: #b8e2c8;
            color: #2d5a3f;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .navbar-escuela {
                padding: 0 16px;
            }
            .nombre-neuropassport-escuela {
                font-size: 26px;
            }
            .estudiantes-contenedor {
                padding: 20px;
            }
            .estudiantes-header {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar con el texto NeuroPassport -->
    <header class="navbar-escuela">
        <h1 class="nombre-neuropassport-escuela">
            NeuroPassport
        </h1>

        <a href="configuracion.html"
           class="perfil-escuela"
           id="perfilInstitucion"
           title="Configuración"
           aria-label="Configuración">
            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>
        </a>
    </header>

    <!-- Contenido principal -->
    <main class="estudiantes-contenedor">
        <header class="estudiantes-header">
            <div class="estudiantes-titulo-box">
                <h1>Estudiantes</h1>
                <p>Estudiantes vinculados a esta institución.</p>
            </div>

            <button type="button" class="btn-linkear-estudiante">
                + Linkear estudiante
            </button>
        </header>
    </main>

    <script src="escuela.js" defer></script>

</body>

</html>
