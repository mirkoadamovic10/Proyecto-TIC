<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        .barra-empresa {
            width: 100%;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 35px;
            background: #705E32 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .logo-empresa {
            margin: 0;
            padding: 0;
            color: #D9E2E3;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
        }

        /* PERFIL Y MENÚ DESPLEGABLE */

        .contenedor-perfil {
            position: relative;
        }

        .boton-perfil {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 50%;
            background: #D9D9D9;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .boton-perfil:hover {
            background: #C8C8C8;
        }

        .menu-perfil {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            width: 210px;
            padding: 7px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .menu-perfil.mostrar {
            display: flex;
            flex-direction: column;
        }

        .opcion-perfil {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #222;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }

        .opcion-perfil:hover {
            background: #F0F8ED;
        }

        .opcion-cerrar-sesion {
            color: #222;
        }

        .separador-perfil {
            height: 1px;
            margin: 5px 3px;
            background: #E5E5E5;
        }

        .empresa-principal {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 58px 20px 40px;
        }

        .empresa-bienvenida {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin: 0 0 26px;
        }

        .empresa-titulos {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .empresa-bienvenida h1 {
            margin: -25px 0 0;
            padding: 0;
            font-size: 48px;
            line-height: 1.2;
            font-weight: 700;
            color: #111;
        }

        /* BOTÓN VOLVER */

        .boton-volver {
            width: 80px !important;
            min-width: 80px !important;
            height: 30px !important;
            min-height: 30px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 0 6px !important;
            margin-left: -8px !important;
            border: none !important;
            border-radius: 8px;
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transform: none !important;
            transition: none !important;
            box-shadow: none !important;
            outline: none !important;
            position: static !important;
        }

        .boton-agregar-empleado {
            flex: 0 0 209px;
            width: 209px;
            min-width: 209px;
            height: 61px;
            min-height: 61px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 0 12px;
            border: none !important;
            border-radius: 15px;
            background: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: none !important;
        }

        .boton-agregar-empleado:hover {
            background: #A5D9B8 !important;
        }

        .lista-empleados {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            margin: 0;
            padding: 0;
        }

        .tarjeta-hospital {
            width: 100%;
            min-height: 58px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 13px;
            margin: 0;
            padding: 9px 14px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 6px;
        }

        .avatar-medico {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            background: #D9D9D9;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar-medico img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .datos-medico {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
        }

        .datos-medico h2 {
            margin: 0;
            padding: 0;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .datos-medico .estado-vinculado {
            margin: 0;
            padding: 0;
            color: #555;
            font-size: 12px;
        }

        .mensaje-vacio {
            margin: 0;
            padding: 0;
            color: #444;
            font-size: 16px;
            line-height: 1.5;
        }

        .ventana-hospital {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.38);
        }

        .ventana-hospital.mostrar {
            display: flex !important;
        }

        .formulario-hospital {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #D6E9D9 !important;
            border-radius: 15px;
            background: #FFFFFF !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12) !important;
        }

        .formulario-hospital header {
            margin: 0 0 22px;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .formulario-hospital h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .formulario-hospital header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .cerrar-hospital {
            position: absolute;
            top: 12px;
            right: 16px;
            padding: 0;
            border: none !important;
            background: transparent !important;
            color: #555 !important;
            font-size: 28px;
            cursor: pointer;
            box-shadow: none !important;
        }

        .formulario-hospital form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formulario-hospital label {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .formulario-hospital input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #CBDDD0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #111;
            font: inherit;
            font-size: 13px;
        }

        .formulario-hospital input:focus {
            outline: 2px solid #B7E4C7;
            border-color: #77B894;
        }

        .boton-guardar-hospital {
            margin-top: 12px;
            padding: 12px 14px;
            border: none !important;
            border-radius: 8px;
            background: #785D2A !important;
            color: #FFFFFF !important;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
        }

        .mensaje-hospital {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .seccion-solicitudes {
            margin-top: 24px;
        }

        .seccion-solicitudes h2 {
            font-size: 20px;
        }

        .solicitud-hospital {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px;
            margin-bottom: 10px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 8px;
        }

        .datos-solicitud {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .acciones-solicitud {
            display: flex;
            gap: 8px;
        }

        .aceptar-solicitud,
        .rechazar-solicitud {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .aceptar-solicitud {
            background: #B7E4C7;
        }

        .rechazar-solicitud {
            background: #F1D4D4;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            .barra-empresa {
                padding: 8px 16px;
                min-height: 70px;
            }

            .logo-empresa {
                font-size: 23px;
            }

            .boton-perfil {
                width: 42px;
                height: 42px;
            }

            .empresa-principal {
                padding: 38px 14px 30px;
            }

            .empresa-bienvenida {
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 16px;
            }

            .empresa-bienvenida h1 {
                font-size: 36px;
            }

            .boton-agregar-empleado {
                flex-basis: 209px;
                width: 209px;
                min-width: 209px;
            }

            .formulario-hospital {
                padding: 30px;
            }
        }

        /* COLOR EXACTO DEL BOTÓN VOLVER EN TODOS LOS ESTADOS */

        a.boton-volver,
        a.boton-volver:hover,
        a.boton-volver:focus,
        a.boton-volver:focus-visible,
        a.boton-volver:active,
        a.boton-volver:visited {
            background: #B7E4C7 !important;
            background-color: #B7E4C7 !important;
            color: #285866 !important;
        }
    </style>
</head>

<body>

    <header class="barra-empresa">
        <h2 class="logo-empresa">NeuroPassport</h2>

        <div class="contenedor-perfil">

            <button
                type="button"
                class="boton-perfil"
                id="botonPerfil"
                aria-label="Abrir menú de perfil"
                aria-expanded="false"
                aria-controls="menuPerfil">

                <svg viewBox="0 0 24 24" width="32" height="32" fill="#000000">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                </svg>

            </button>

            <nav class="menu-perfil" id="menuPerfil">

                <a href="configuracion.html" class="opcion-perfil">
                    Configuración
                </a>

                <a href="informacion-personal.html" class="opcion-perfil">
                    Información personal
                </a>

                <div class="separador-perfil"></div>

                <button
                    type="button"
                    class="opcion-perfil opcion-cerrar-sesion"
                    id="botonCerrarSesion">
                    Cerrar sesión
                </button>

            </nav>

        </div>
    </header>

    <main class="empresa-principal">

        <section class="empresa-bienvenida">

            <div class="empresa-titulos">

                <a href="javascript:history.back()" class="boton-volver">
                    <span aria-hidden="true">←</span>
                    Volver
                </a>

                <h1>Empleados</h1>

            </div>

            <button
                type="button"
                class="boton-agregar-empleado"
                id="botonLinkearEmpleado">
                + Linkear empleado
            </button>

        </section>

        <section
            class="lista-empleados"
            id="empleadosVinculados"
            aria-label="Empleados vinculados">
        </section>

        <section
            class="seccion-solicitudes"
            id="seccionSolicitudesEmpleados"
            hidden>
            <h2>Solicitudes de vinculación (prueba)</h2>
            <div id="listaSolicitudesEmpleados"></div>
        </section>

    </main>

    <aside
        id="ventanaEmpleado"
        class="ventana-hospital"
        aria-hidden="true">

        <section
            class="formulario-hospital"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloVinculacionEmpleado">

            <button
                type="button"
                id="cerrarModalEmpleado"
                class="cerrar-hospital"
                aria-label="Cerrar">
                ×
            </button>

            <header>
                <h2 id="tituloVinculacionEmpleado">Linkear empleado</h2>
                <p>Ingresá los datos del empleado que querés vincular.</p>
            </header>

            <form id="formularioEmpleado">

                <label for="nombreEmpleado">Nombre y apellido</label>
                <input
                    type="text"
                    id="nombreEmpleado"
                    name="nombreEmpleado"
                    autocomplete="name"
                    placeholder="Ej.: Ana Pérez"
                    required>

                <label for="dniEmpleado">DNI</label>
                <input
                    type="text"
                    id="dniEmpleado"
                    name="dniEmpleado"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Ingresá el DNI"
                    required>

                <label for="codigoEmpleado">Código del empleado</label>
                <input
                    type="text"
                    id="codigoEmpleado"
                    name="codigoEmpleado"
                    autocomplete="off"
                    placeholder="Ingresá el código"
                    required>

                <button
                    type="submit"
                    id="guardarEmpleado"
                    class="boton-guardar-hospital">
                    Enviar solicitud
                </button>

            </form>

            <output
                id="mensajeEmpleado"
                class="mensaje-hospital"
                aria-live="polite"></output>

        </section>
    </aside>

    <script src="empleados.js" defer></script>

    <script>
        const botonPerfil = document.getElementById("botonPerfil");
        const menuPerfil = document.getElementById("menuPerfil");
        const botonCerrarSesion = document.getElementById("botonCerrarSesion");

        // Abrir y cerrar el menú
        botonPerfil.addEventListener("click", function (event) {
            event.stopPropagation();

            const estaAbierto = menuPerfil.classList.toggle("mostrar");

            botonPerfil.setAttribute("aria-expanded", estaAbierto);
        });

        // Cerrar al hacer clic fuera del menú
        document.addEventListener("click", function (event) {
            if (
                !menuPerfil.contains(event.target) &&
                !botonPerfil.contains(event.target)
            ) {
                menuPerfil.classList.remove("mostrar");
                botonPerfil.setAttribute("aria-expanded", "false");
            }
        });

        // Cerrar con Escape
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                menuPerfil.classList.remove("mostrar");
                botonPerfil.setAttribute("aria-expanded", "false");
            }
        });

        // Cerrar sesión
        botonCerrarSesion.addEventListener("click", function () {
            window.location.href = "../cerrar-sesion.html";
        });
    </script>

</body>
</html>
