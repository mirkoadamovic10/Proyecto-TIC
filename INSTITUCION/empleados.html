
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        /* NAVBAR */

        .barra-empresa {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 8px 24px;
            background: #785D2A !important;
            border: none !important;
            box-shadow: none !important;
        }

        .menu-empresa {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
        }

        .boton-menu-empresa {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 120px;
            min-height: 32px;
            padding: 6px 18px;
            border: none !important;
            border-radius: 8px;
            background: #D6B5E2 !important;
            color: #111 !important;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            box-shadow: none !important;
        }

        .boton-menu-empresa:hover {
            background: #C7A0D6 !important;
        }

        /* CONTENIDO */

        .empresa-principal {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 58px 20px 40px;
        }

        .empresa-bienvenida {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin: 0 0 26px;
        }

        .empresa-bienvenida h1 {
            margin: 0;
            padding: 0;
            font-size: 48px;
            line-height: 1.2;
            font-weight: 700;
            color: #111;
        }

        .boton-agregar-empleado {
            flex: 0 0 209px;
            width: 209px;
            min-width: 209px;
            height: 61px;
            min-height: 61px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0 12px;
            border: none !important;
            border-radius: 15px;
            background: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: none !important;
        }

        .boton-agregar-empleado:hover {
            background: #A5D9B8 !important;
        }

        /* LISTA DE EMPLEADOS */

        .lista-empleados {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            margin: 0;
            padding: 0;
        }

        .tarjeta-hospital {
            width: 100%;
            min-height: 58px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 13px;
            margin: 0;
            padding: 9px 14px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 6px;
        }

        .avatar-medico {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            background: #D9D9D9;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar-medico img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .datos-medico {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
        }

        .datos-medico h2 {
            margin: 0;
            padding: 0;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .datos-medico .estado-vinculado {
            margin: 0;
            padding: 0;
            color: #555;
            font-size: 12px;
        }

        .mensaje-vacio {
            margin: 0;
            padding: 0;
            color: #444;
            font-size: 16px;
            line-height: 1.5;
        }

        /* VENTANA: MISMO LAYOUT QUE ESTUDIANTES */

        .ventana-hospital {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.38);
        }

        .ventana-hospital.mostrar {
            display: flex !important;
        }

        .formulario-hospital {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #D6E9D9 !important;
            border-radius: 15px;
            background: #FFFFFF !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12) !important;
        }

        .formulario-hospital header {
            margin: 0 0 22px;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .formulario-hospital h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .formulario-hospital header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .cerrar-hospital {
            position: absolute;
            top: 12px;
            right: 16px;
            padding: 0;
            border: none !important;
            background: transparent !important;
            color: #555 !important;
            font-size: 28px;
            cursor: pointer;
            box-shadow: none !important;
        }

        .formulario-hospital form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formulario-hospital label {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .formulario-hospital input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #CBDDD0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #111;
            font: inherit;
            font-size: 13px;
        }

        .formulario-hospital input:focus {
            outline: 2px solid #B7E4C7;
            border-color: #77B894;
        }

        .boton-guardar-hospital {
            margin-top: 12px;
            padding: 12px 14px;
            border: none !important;
            border-radius: 8px;
            background: #785D2A !important;
            color: #FFFFFF !important;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
        }

        .mensaje-hospital {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* SOLICITUDES */

        .seccion-solicitudes {
            margin-top: 24px;
        }

        .seccion-solicitudes h2 {
            font-size: 20px;
        }

        .solicitud-hospital {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px;
            margin-bottom: 10px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 8px;
        }

        .datos-solicitud {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .acciones-solicitud {
            display: flex;
            gap: 8px;
        }

        .aceptar-solicitud,
        .rechazar-solicitud {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .aceptar-solicitud {
            background: #B7E4C7;
        }

        .rechazar-solicitud {
            background: #F1D4D4;
        }

        [hidden] {
            display: none !important;
        }

        /* CELULARES */

        @media (max-width: 600px) {
            .barra-empresa {
                padding: 8px 10px;
            }

            .menu-empresa {
                width: 100%;
                justify-content: flex-end;
                gap: 6px;
            }

            .boton-menu-empresa {
                min-width: 0;
                padding: 6px 12px;
                font-size: 12px;
            }

            .empresa-principal {
                padding: 38px 14px 30px;
            }

            .empresa-bienvenida {
                flex-wrap: wrap;
                gap: 16px;
            }

            .empresa-bienvenida h1 {
                font-size: 36px;
            }

            .boton-agregar-empleado {
                flex-basis: 209px;
                width: 209px;
                min-width: 209px;
            }

            .formulario-hospital {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <header class="barra-empresa">
        <nav class="menu-empresa" aria-label="Navegación principal">
            <a class="boton-menu-empresa" href="empresa.html">Inicio</a>
            <a class="boton-menu-empresa" href="empleados.html" aria-current="page">Empleados</a>
        </nav>
    </header>

    <main class="empresa-principal">

        <section class="empresa-bienvenida">
            <h1>Empleados</h1>

            <button
                type="button"
                class="boton-agregar-empleado"
                id="botonLinkearEmpleado">
                + Linkear empleado
            </button>
        </section>

        <section
            class="lista-empleados"
            id="empleadosVinculados"
            aria-label="Empleados vinculados">
        </section>

        <section
            class="seccion-solicitudes"
            id="seccionSolicitudesEmpleados"
            hidden>
            <h2>Solicitudes de vinculación (prueba)</h2>
            <div id="listaSolicitudesEmpleados"></div>
        </section>

    </main>

    <!-- VENTANA PARA LINKEAR EMPLEADO -->

    <aside
        id="ventanaEmpleado"
        class="ventana-hospital"
        aria-hidden="true">

        <section
            class="formulario-hospital"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloVinculacionEmpleado">

            <button
                type="button"
                id="cerrarModalEmpleado"
                class="cerrar-hospital"
                aria-label="Cerrar">
                ×
            </button>

            <header>
                <h2 id="tituloVinculacionEmpleado">Linkear empleado</h2>
                <p>Ingresá los datos del empleado que querés vincular.</p>
            </header>

            <form id="formularioEmpleado">

                <label for="nombreEmpleado">Nombre y apellido</label>
                <input
                    type="text"
                    id="nombreEmpleado"
                    name="nombreEmpleado"
                    autocomplete="name"
                    placeholder="Ej.: Ana Pérez"
                    required>

                <label for="dniEmpleado">DNI</label>
                <input
                    type="text"
                    id="dniEmpleado"
                    name="dniEmpleado"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Ingresá el DNI"
                    required>

                <label for="codigoEmpleado">Código del empleado</label>
                <input
                    type="text"
                    id="codigoEmpleado"
                    name="codigoEmpleado"
                    autocomplete="off"
                    placeholder="Ingresá el código"
                    required>

                <button
                    type="submit"
                    id="guardarEmpleado"
                    class="boton-guardar-hospital">
                    Enviar solicitud
                </button>

            </form>

            <output
                id="mensajeEmpleado"
                class="mensaje-hospital"
                aria-live="polite"></output>

        </section>
    </aside>

    <script src="empleados.js" defer></script>

</body>
</html>
