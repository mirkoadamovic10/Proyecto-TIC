<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - NeuroPassport</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="pagina-empresa">

    <header class="barra-empresa">

        <div class="menu-empresa">

            <button class="boton-menu-empresa" onclick="location.href='empresa.html'">
                Inicio
            </button>

            <button class="boton-menu-empresa">
                Empleados
            </button>

        </div>

        <div class="perfil-empresa">
            <div class="avatar-empresa"></div>

            <div class="submenu-perfil-empresa">
                <button>Configuración</button>
                <button>Información personal</button>
            </div>
        </div>

    </header>

    <main class="empresa-pagina">

        <h1>Mis empleados</h1>

        <p class="texto-empresa">
            Linkeá un empleado utilizando su código de NeuroPassport.
        </p>

        <section class="formulario-linkear-empresa">

            <input
                type="text"
                id="codigoEmpleado"
                placeholder="Código del empleado"
            >

            <button id="botonLinkearEmpleado">
                Linkear empleado
            </button>

        </section>

        <section class="lista-empleados">

            <h2>Empleados vinculados</h2>

            <div id="empleadosVinculados"></div>

        </section>

    </main>

    <script src="empleados.js"></script>

</body>

</html>
