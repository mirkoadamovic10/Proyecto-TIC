<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Pacientes - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        /* NAVBAR: IGUAL A MÉDICOS */
        .barra-empresa {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 8px 24px;
            background: #A34C4C !important;
            border: none !important;
            box-shadow: none !important;
        }

        .menu-empresa {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .boton-menu-empresa {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 120px;
            min-height: 32px;
            padding: 6px 18px;
            border: none !important;
            border-radius: 8px;
            background: #D6B5E2 !important;
            color: #111 !important;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            box-shadow: none !important;
        }

        .boton-menu-empresa:hover {
            background: #C7A0D6 !important;
        }

        /* CONTENIDO: IGUAL A MÉDICOS */
        .empresa-principal {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 58px 20px 40px;
        }

        .empresa-bienvenida {

            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            gap: 20px;
            margin: 0 0 26px !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .empresa-bienvenida header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* TÍTULO */
        .empresa-bienvenida h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 48px !important;
            line-height: 1.2 !important;
            font-weight: 700 !important;
            color: #111 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* SUBTÍTULO */
        .empresa-bienvenida p {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 20px !important;
            line-height: 1.5 !important;
            color: #222 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* BOTÓN LINKEAR PACIENTE */
        .boton-agregar-hospital {
            flex: 0 0 209px;
            width: 209px !important;
            min-width: 209px !important;
            height: 61px !important;
            min-height: 61px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 !important;
            padding: 0 12px !important;
            border: none !important;
            border-radius: 15px !important;
            background: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: none !important;
            position: static !important;
        }

        .boton-agregar-hospital:hover {
            background: #A5D9B8 !important;
        }

        /* LISTA DE PACIENTES */
        .lista-hospital {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch;
            gap: 7px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .tarjeta-hospital {
            width: 100% !important;
            min-height: 58px !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 13px !important;
            margin: 0 !important;
            padding: 9px 14px !important;
            background: #FFFFFF !important;
            border: 1px solid #D6E9D9 !important;
            border-radius: 6px !important;
            box-shadow: none !important;
        }

        .tarjeta-hospital h2 {
            flex: 0 0 auto;
            margin: 0 !important;
            padding: 0 !important;
            color: #111 !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            overflow-wrap: anywhere;
        }

        .tarjeta-hospital p {
            flex: 1;
            min-width: 0;
            margin: 0 !important;
            padding: 0 !important;
            color: #555 !important;
            font-size: 12px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            overflow-wrap: anywhere;
        }

        .boton-ver-hospital {
            flex-shrink: 0;
            padding: 9px 14px;
            border: none !important;
            border-radius: 8px;
            background: #B7E4C7 !important;
            color: #285866 !important;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: none !important;
        }

        .boton-ver-hospital:hover {
            background: #A5D9B8 !important;
        }

        /* MENSAJE CUANDO NO HAY PACIENTES */
        .mensaje-vacio {
            margin: 0 !important;
            padding: 0 !important;
            color: #444 !important;
            font-size: 16px !important;
            line-height: 1.5;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .ventana-hospital {

            justify-content: center;

            padding: 20px;
            background: rgba(0, 0, 0, 0.38);
        }

        .ventana-hospital.mostrar {
            display: flex !important;
        }

        .formulario-hospital {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #D6E9D9 !important;
            border-radius: 15px;
            background: #FFFFFF !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12) !important;
        }

        .formulario-hospital header {
            margin: 0 0 22px;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .formulario-hospital h2 {
            margin: 0 0 8px;

        }

        .formulario-hospital header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .cerrar-hospital {
            position: absolute;
            top: 12px;
            right: 16px;
            padding: 0;
            border: none !important;
            background: transparent !important;
            color: #555 !important;
            font-size: 28px;
            cursor: pointer;
            box-shadow: none !important;
        }

        .formulario-hospital form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formulario-hospital label {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .formulario-hospital input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #CBDDD0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #111;
            font: inherit;
            font-size: 13px;
        }

        .formulario-hospital input:focus {
            outline: 2px solid #B7E4C7;
            border-color: #77B894;
        }

        .boton-guardar-hospital {
            margin-top: 12px;
            padding: 12px 14px;
            border: none !important;
            border-radius: 8px;
            background: #A34C4C !important;
            color: #FFFFFF !important;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;

        }

        .mensaje-hospital {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* PANTALLAS PEQUEÑAS */
        @media (max-width: 600px) {
            .barra-empresa {
                padding: 8px 10px;
            }

            .menu-empresa {
                width: 100%;
                justify-content: flex-end;
                gap: 6px;
            }

            .boton-menu-empresa {
                min-width: 0;
                min-height: 32px;
                padding: 6px 12px;
                font-size: 12px;
            }

            .empresa-principal {
                padding: 38px 14px 30px;
            }

            .empresa-bienvenida {
                flex-wrap: wrap;
                gap: 16px;
            }

            .empresa-bienvenida h1 {
                font-size: 48px !important;
            }

            .empresa-bienvenida p {
                font-size: 20px !important;
            }

            .boton-agregar-hospital {
                width: 209px !important;
                min-width: 209px !important;
                height: 61px !important;
                min-height: 61px !important;
                flex-basis: 209px;
            }

            .tarjeta-hospital {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="barra-empresa">
        <nav class="menu-empresa" aria-label="Navegación principal">
            <a href="hospital.html" class="boton-menu-empresa">Inicio</a>
            <a href="medicos.html" class="boton-menu-empresa">Médicos</a>
            <a href="pacientes.html" class="boton-menu-empresa" aria-current="page">Pacientes</a>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="empresa-principal">

        <section class="empresa-bienvenida">
            <header>
                <h1>Pacientes</h1>
                <p>Personas vinculadas a este hospital.</p>
            </header>

            <button
                type="button"
                id="botonAgregarPaciente"
                class="boton-agregar-hospital">
                + Linkear paciente
            </button>
        </section>

        <!-- LISTA DE PACIENTES -->
        <section
            id="listaPacientes"
            class="lista-hospital"
            aria-label="Pacientes vinculados">

            <p class="mensaje-vacio">
                Todavía no hay pacientes vinculados.
            </p>

        </section>

    </main>

    <!-- VENTANA PARA LINKEAR PACIENTE -->
    <aside
        id="ventanaPaciente"
        class="ventana-hospital"
        aria-hidden="true">

        <section
            class="formulario-hospital"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloVentanaPaciente">

            <button
                type="button"
                id="cerrarPaciente"
                class="cerrar-hospital"
                aria-label="Cerrar">
                ×
            </button>

            <header>
                <h2 id="tituloVentanaPaciente">Linkear paciente</h2>
                <p>Ingresá el correo electrónico del paciente que querés vincular.</p>
            </header>

            <form id="formularioPaciente">

                <label for="emailPaciente">Correo electrónico</label>

                <input
                    type="email"
                    id="emailPaciente"
                    name="emailPaciente"
                    autocomplete="email"
                    placeholder="Ingresá el correo del paciente"
                    required>

                <button
                    type="submit"
                    id="guardarPaciente"
                    class="boton-guardar-hospital">
                    Vincular paciente
                </button>

            </form>

            <output
                id="mensajePaciente"
                class="mensaje-hospital"
                aria-live="polite">
            </output>

        </section>
    </aside>

    <script src="pacientes.js" defer></script>

</body>
</html>
