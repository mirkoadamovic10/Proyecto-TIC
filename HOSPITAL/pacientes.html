<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pacientes - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <header class="barra-empresa">

        <nav class="menu-empresa" aria-label="Navegación principal">

            <a href="hospital.html" class="boton-menu-empresa">
                Inicio
            </a>

            <a href="medicos.html" class="boton-menu-empresa">
                Médicos
            </a>

            <a href="pacientes.html" class="boton-menu-empresa">
                Pacientes
            </a>

        </nav>

    </header>


    <main class="empresa-principal">

        <section class="empresa-bienvenida">

            <header>

                <h1>Pacientes</h1>

                <p>
                    Personas vinculadas al hospital.
                </p>

            </header>


            <button
                type="button"
                id="botonAgregarPaciente"
                class="boton-agregar-hospital">

                + Linkear paciente

            </button>

        </section>


        <section
            id="listaPacientes"
            class="lista-hospital"
            aria-label="Lista de pacientes">

        </section>

    </main>


    <aside
        id="ventanaPaciente"
        class="ventana-hospital">

        <section class="formulario-hospital">

            <button
                type="button"
                id="cerrarPaciente"
                class="cerrar-hospital"
                aria-label="Cerrar">

                ×

            </button>


            <header>

                <h2>
                    Linkear paciente
                </h2>

                <p>
                    Ingresá el correo electrónico del paciente.
                </p>

            </header>


            <form>

                <label for="emailPaciente">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="emailPaciente"
                    placeholder="paciente@email.com">


                <button
                    type="button"
                    id="guardarPaciente"
                    class="boton-guardar-hospital">

                    Linkear paciente

                </button>

            </form>


            <output
                id="mensajePaciente"
                class="mensaje-hospital">
            </output>

        </section>

    </aside>


    <script src="pacientes.js"></script>

</body>

</html>
