<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F0F8ED !important;
            color: #111;
        }

        /* NAVBAR */
        .barra-empresa {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 24px;
            background: #A45656 !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* TEXTO NEUROPASSPORT */
        .barra-empresa .logo-navbar {
            margin: 0;
            padding: 0;
            color: #D9E2E3 !important;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
        }

        .menu-empresa {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .boton-menu-empresa {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 120px;
            min-height: 32px;
            padding: 6px 18px;
            border: none !important;
            border-radius: 8px;
            background: #D6B5E2 !important;
            color: #111 !important;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            box-shadow: none !important;
        }

        .boton-menu-empresa:hover {
            background: #C7A0D6 !important;
        }

        /* BOTÓN DE PERFIL */
        .barra-empresa .perfil-empresa,
        .barra-empresa .perfil-empresa:hover,
        .barra-empresa .perfil-empresa:focus,
        .barra-empresa .perfil-empresa:active {
            width: 50px !important;
            height: 50px !important;
            min-width: 50px;
            margin: -6px 0 !important;
            padding: 0 !important;

            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;

            background: #D9D9D9 !important;
            border: none !important;
            border-radius: 50% !important;
            box-shadow: none !important;

            text-decoration: none;
            transform: translateY(-12px) !important;
            transition: none !important;
            animation: none !important;
        }

        /* Cabeza de la persona */
        .barra-empresa .perfil-empresa .perfil-cabeza {
            display: block !important;
            width: 13px !important;
            height: 13px !important;
            margin: 0 !important;
            background: #000000 !important;
            border-radius: 50% !important;
        }

        /* Cuerpo de la persona */
        .barra-empresa .perfil-empresa .perfil-cuerpo {
            display: block !important;
            width: 24px !important;
            height: 12px !important;
            margin: 0 !important;
            background: #000000 !important;
            border-radius: 12px 12px 6px 6px !important;
        }

        /* DESPLEGABLE DEL PERFIL */
        .barra-empresa {
            position: relative;
        }

        .menu-perfil {
            position: absolute;
            top: 100%;
            right: 16px;
            z-index: 1000;
            width: 210px;
            margin-top: 6px;
            padding: 14px;
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        }

        .menu-perfil[hidden] {
            display: none;
        }

        .menu-perfil ul {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu-perfil li {
            margin: 0;
            padding: 0;
        }

        .menu-perfil button,
        .menu-perfil button:hover {
            width: 100%;
            min-height: 64px;
            padding: 12px 16px;
            background: #DCE6E8 !important;
            color: #2F7185 !important;
            border: none !important;
            border-radius: 16px;
            box-shadow: none !important;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transform: none !important;
        }

        /* CONTENIDO */
        .empresa-principal {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 58px 20px 40px;
        }

        /* BOTÓN VOLVER */
        .boton-volver,
        .boton-volver:hover,
        .boton-volver:focus,
        .boton-volver:active {
            display: flex;
            width: fit-content;
            align-items: center;
            gap: 8px;
            margin: 0 0 14px;
            padding: 9px 14px;
            background: #B7E4C7 !important;
            color: #2F7185 !important;
            border: none !important;
            border-radius: 14px;
            box-shadow: none !important;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transform: none !important;
        }

        .boton-volver:hover {
            background: #A5D9B8 !important;
        }

        .boton-volver .flecha-volver {
            font-size: 20px;
            line-height: 1;
        }

        .empresa-bienvenida {
            width: 100%;
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            gap: 20px;
            margin: 0 0 26px !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .empresa-bienvenida header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* TÍTULO MÉDICOS */
        .empresa-bienvenida h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 48px !important;
            line-height: 1.2 !important;
            font-weight: 700 !important;
            color: #111 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* TEXTO DEBAJO DEL TÍTULO */
        .empresa-bienvenida p {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 20px !important;
            line-height: 1.5 !important;
            color: #222 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* BOTÓN LINKEAR PERSONA */
        .boton-agregar-hospital {
            flex: 0 0 209px;
            width: 209px !important;
            min-width: 209px !important;
            height: 61px !important;
            min-height: 61px !important;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 !important;
            padding: 0 12px !important;

            border: none !important;
            border-radius: 15px !important;

            background: #B7E4C7 !important;
            color: #285866 !important;

            font-size: 14px;
            font-weight: 500;
            cursor: pointer;

            box-shadow: none !important;
            position: static !important;
        }

        .boton-agregar-hospital:hover {
            background: #A5D9B8 !important;
        }

        /* TARJETAS BLANCAS */
        .lista-hospital {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch;
            gap: 7px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .tarjeta-hospital {
            width: 100% !important;
            min-height: 58px !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 13px !important;
            margin: 0 !important;
            padding: 9px 14px !important;
            background: #FFFFFF !important;
            border: 1px solid #D6E9D9 !important;
            border-radius: 6px !important;
            box-shadow: none !important;
        }

        a.tarjeta-medico,
        a.tarjeta-medico:visited {
            color: #111 !important;
            text-decoration: none !important;
            justify-content: flex-start !important;
            cursor: pointer;
        }

        a.tarjeta-medico:hover {
            border-color: #E2B8B8;
            background: #FFFCFC;
        }

        a.tarjeta-paciente,
        a.tarjeta-paciente:visited {
            color: #111 !important;
            text-decoration: none !important;
            justify-content: flex-start !important;
            cursor: pointer;
        }

        a.tarjeta-paciente:hover {
            border-color: #E2B8B8;
            background: #FFFCFC;
        }

        .avatar-medico {
            flex: 0 0 42px !important;
            width: 42px !important;
            height: 42px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50% !important;
            background: #D9D9D9 !important;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar-medico img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .datos-medico {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
        }

        .datos-medico h2 {
            margin: 0 !important;
            padding: 0 !important;
            color: #111 !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            overflow-wrap: anywhere;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .datos-medico p,
        .datos-medico .estado-vinculado {
            margin: 0 !important;
            padding: 0 !important;
            color: #555 !important;
            font-size: 12px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* MENSAJE CUANDO NO HAY PERSONAS */
        .mensaje-vacio {
            margin: 0;
            padding: 0;
            color: #444;
            font-size: 16px !important;
            line-height: 1.5;
        }

        /* SOLICITUDES DE PRUEBA */
        .seccion-solicitudes {
            margin-top: 30px;
        }

        .seccion-solicitudes h2 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        .solicitud-hospital {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px;
            margin-bottom: 8px;
            background: #FFFFFF;
            border: 1px solid #D6E9D9;
            border-radius: 8px;
        }

        .datos-solicitud {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .datos-solicitud strong {
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .datos-solicitud span {
            font-size: 12px;
            color: #555;
        }

        .acciones-solicitud {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .acciones-solicitud button {
            padding: 8px 11px;
            border: none;
            border-radius: 7px;
            font-size: 12px;
            cursor: pointer;
        }

        .aceptar-solicitud {
            background: #B7E4C7;
            color: #285866;
        }

        .rechazar-solicitud {
            background: #F3DADA;
            color: #803D3D;
        }

        /* VENTANA DE VINCULACIÓN */
        .ventana-hospital {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.38);
        }

        .ventana-hospital.mostrar {
            display: flex !important;
        }

        .formulario-hospital {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #D6E9D9 !important;
            border-radius: 15px;
            background: #FFFFFF !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12) !important;
        }

        .formulario-hospital header {
            margin: 0 0 22px;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .formulario-hospital h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .formulario-hospital header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .cerrar-hospital {
            position: absolute;
            top: 12px;
            right: 16px;
            padding: 0;
            border: none !important;
            background: transparent !important;
            color: #555 !important;
            font-size: 28px;
            cursor: pointer;
            box-shadow: none !important;
        }

        .formulario-hospital form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formulario-hospital label {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .formulario-hospital input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #CBDDD0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #111;
            font: inherit;
            font-size: 13px;
        }

        .formulario-hospital input:focus {
            outline: 2px solid #B7E4C7;
            border-color: #77B894;
        }

        .boton-guardar-hospital {
            margin-top: 12px;
            padding: 12px 14px;
            border: none !important;
            border-radius: 8px;
            background: #A34C4C !important;
            color: #FFFFFF !important;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
        }

        .mensaje-hospital {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* PANTALLAS PEQUEÑAS */
        @media (max-width: 600px) {
            .barra-empresa {
                padding: 8px 10px;
            }

            .menu-empresa {
                width: 100%;
                justify-content: flex-end;
                gap: 6px;
            }

            .boton-menu-empresa {
                min-width: 0;
                min-height: 32px;
                padding: 6px 12px;
                font-size: 12px;
            }

            .empresa-principal {
                padding: 38px 14px 30px;
            }

            .empresa-bienvenida {
                flex-wrap: wrap;
                gap: 16px;
            }

            .empresa-bienvenida h1 {
                font-size: 48px !important;
            }

            .empresa-bienvenida p {
                font-size: 20px !important;
            }

            .boton-agregar-hospital {
                width: 209px !important;
                min-width: 209px !important;
                height: 61px !important;
                min-height: 61px !important;
                flex-basis: 209px;
            }

            .solicitud-hospital {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="barra-empresa">

        <p class="logo-navbar">NeuroPassport</p>

        <a
            href="configuracion.html"
            class="perfil-empresa"
            id="botonPerfilPacientes"
            title="Perfil"
            aria-label="Abrir menú de perfil"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="menuPerfilPacientes">

            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>

        </a>

        <nav class="menu-perfil" id="menuPerfilPacientes" aria-label="Menú de perfil" hidden>

            <ul>
                <li>
                    <button type="button" onclick="window.location.href='configuracion.html'">
                        Configuración
                    </button>
                </li>

                <li>
                    <button type="button" onclick="window.location.href='informacion-personal.html'">
                        Información personal
                    </button>
                </li>

                <li>
                    <button type="button" onclick="window.location.href='../cerrar-sesion.html'">
                        Cerrar sesión
                    </button>
                </li>
            </ul>

        </nav>

    </header>

    <main class="empresa-principal">

        <a href="hospital.html" class="boton-volver">
            <span class="flecha-volver" aria-hidden="true">←</span>
            Volver
        </a>

        <section class="empresa-bienvenida">
            <header>
                <h1>Pacientes</h1>
                <p>Pacientes vinculados a este hospital.</p>
            </header>

            <button
                type="button"
                id="botonAgregarPaciente"
                class="boton-agregar-hospital">
                + Linkear paciente
            </button>
        </section>

        <section
            id="listaPacientes"
            class="lista-hospital"
            aria-label="Pacientes vinculados">
        </section>

    </main>

    <aside
        id="ventanaPaciente"
        class="ventana-hospital"
        aria-hidden="true">

        <section
            class="formulario-hospital"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloVentanaPaciente">

            <button
                type="button"
                id="cerrarPaciente"
                class="cerrar-hospital"
                aria-label="Cerrar">
                ×
            </button>

            <header>
                <h2 id="tituloVentanaPaciente">Linkear paciente</h2>
                <p>Ingresá el correo electrónico del paciente que querés vincular.</p>
            </header>

            <form id="formularioPaciente">
                <label for="emailPaciente">Correo electrónico</label>
                <input
                    type="email"
                    id="emailPaciente"
                    autocomplete="email"
                    placeholder="Ingresá el correo del paciente"
                    required>

                <button
                    type="submit"
                    id="guardarPaciente"
                    class="boton-guardar-hospital">
                    Vincular paciente
                </button>
            </form>

            <output
                id="mensajePaciente"
                class="mensaje-hospital"
                aria-live="polite">
            </output>

        </section>
    </aside>

    <script>
        (function () {
            var botonPerfilPacientes = document.getElementById('botonPerfilPacientes');
            var menuPerfilPacientes = document.getElementById('menuPerfilPacientes');

            botonPerfilPacientes.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                menuPerfilPacientes.hidden = !menuPerfilPacientes.hidden;
                botonPerfilPacientes.setAttribute('aria-expanded', String(!menuPerfilPacientes.hidden));
            });

            document.addEventListener('click', function () {
                menuPerfilPacientes.hidden = true;
                botonPerfilPacientes.setAttribute('aria-expanded', 'false');
            });
        })();
    </script>

    <script src="pacientes.js" defer></script>

</body>
</html>
