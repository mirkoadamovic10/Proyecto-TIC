```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Médicos - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <header class="barra-empresa">

        <nav class="menu-empresa" aria-label="Navegación principal">

            <a href="hospital.html" class="boton-menu-empresa">
                Inicio
            </a>

            <a href="medicos.html" class="boton-menu-empresa">
                Médicos
            </a>

            <a href="pacientes.html" class="boton-menu-empresa">
                Pacientes
            </a>

        </nav>

    </header>


    <main class="empresa-principal">

        <section class="empresa-bienvenida">

            <header>

                <h1>Médicos</h1>

                <p>
                    Profesionales vinculados a este hospital.
                </p>

            </header>


            <button
                type="button"
                id="botonAgregarMedico"
                class="boton-agregar-hospital">

                + Agregar médico

            </button>

        </section>


        <section
            id="listaMedicos"
            class="lista-hospital"
            aria-label="Lista de médicos">

        </section>

    </main>


    <aside
        id="ventanaMedico"
        class="ventana-hospital">

        <section class="formulario-hospital">

            <button
                type="button"
                id="cerrarMedico"
                class="cerrar-hospital"
                aria-label="Cerrar">

                ×

            </button>


            <header>

                <h2>
                    Agregar médico
                </h2>

                <p>
                    Ingresá el correo profesional del médico.
                </p>

            </header>


            <form>

                <label for="emailMedico">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="emailMedico"
                    placeholder="medico@email.com">


                <button
                    type="button"
                    id="guardarMedico"
                    class="boton-guardar-hospital">

                    Agregar médico

                </button>

            </form>


            <output
                id="mensajeMedico"
                class="mensaje-hospital">
            </output>

        </section>

    </aside>


    <script src="medicos.js"></script>

</body>

</html>
```
