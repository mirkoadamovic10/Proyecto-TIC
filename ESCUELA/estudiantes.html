<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estudiantes - NeuroPassport</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <header class="barra-escuela">

        <h2>NeuroPassport</h2>

        <nav class="menu-escuela" aria-label="Navegación principal">

            <button
                class="boton-menu-escuela"
                onclick="window.location.href='escuela.html'">
                Inicio
            </button>

            <button
                class="boton-menu-escuela activo"
                onclick="window.location.href='estudiantes.html'">
                Estudiantes
            </button>

        </nav>

        <button
            class="perfil-escuela"
            aria-label="Abrir perfil">

            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>

        </button>

    </header>


    <main class="escuela-pagina">

        <article class="escuela-contenedor">

            <header class="escuela-titulo">

                <div>

                    <p class="escuela-etiqueta">
                        ESTUDIANTES
                    </p>

                    <h1>Mis estudiantes</h1>

                    <p>
                        Vinculá estudiantes para consultar
                        la información que ellos hayan habilitado.
                    </p>

                </div>

            </header>


            <section class="formulario-linkear-escuela">

                <header>

                    <h2>Linkear estudiante</h2>

                    <p>
                        Ingresá el código de vinculación del estudiante.
                    </p>

                </header>

                <label for="codigoEstudiante">
                    Código del estudiante
                </label>

                <input
                    type="text"
                    id="codigoEstudiante"
                    placeholder="Ej: NP-123456"
                >

                <button
                    class="boton-linkear"
                    id="botonLinkear">
                    Linkear estudiante
                </button>

                <p
                    id="mensajeLinkeo"
                    class="mensaje-linkeo">
                </p>

            </section>


            <section class="estudiantes-seccion">

                <header>

                    <h2>Estudiantes vinculados</h2>

                </header>

                <div
                    id="listaEstudiantes"
                    class="lista-estudiantes">
                </div>

            </section>

        </article>

    </main>


    <script src="estudiantes.js"></script>

</body>

</html>
