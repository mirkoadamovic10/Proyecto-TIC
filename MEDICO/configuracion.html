<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="encabezado-configuracion">
        <a href="medico.html" class="volver-configuracion">← Volver</a>
        <h1>Configuración</h1>
    </header>

    <main class="pagina-configuracion">

        <section class="tarjeta-configuracion">

            <div class="perfil-configuracion">

                <div class="foto-configuracion" id="fotoConfiguracion" style="cursor: pointer;">
                    <span class="cabeza-configuracion"></span>
                    <span class="cuerpo-configuracion"></span>
                </div>

                <input
                    type="file"
                    id="inputFoto"
                    accept="image/*"
                    hidden
                >

                <button type="button" class="boton-cambiar-foto" id="botonCambiarFoto">
                    Cambiar foto
                </button>

            </div>

            <div class="datos-configuracion">

                <div class="campo-configuracion">
                    <label for="nombreConfiguracion">Nombre</label>

                    <input
                        type="text"
                        id="nombreConfiguracion"
                        placeholder="Tu nombre"
                    >
                </div>

                <button
                    type="button"
                    class="boton-guardar-configuracion"
                    id="botonGuardarConfiguracion"
                >
                    Guardar cambios
                </button>

                <p class="mensaje-configuracion" id="mensajeConfiguracion"></p>

            </div>

        </section>

    </main>

    <script src="configuracion.js" defer></script>
    
</body>

</html>
