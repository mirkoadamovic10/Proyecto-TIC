```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda médica</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="pagina-agenda">

    <header class="barra-empresa">

        <nav class="menu-empresa" aria-label="Navegación principal">

            <a
                href="medico.html"
                class="boton-menu-empresa">

                Inicio

            </a>


            <a
                href="pacientes.html"
                class="boton-menu-empresa">

                Pacientes

            </a>


            <a
                href="agenda-medico.html"
                class="boton-menu-empresa">

                Agenda

            </a>

        </nav>


        <a
            href="configuracion.html"
            class="perfil-empresa"
            aria-label="Configuración">

            <span class="perfil-cabeza"></span>
            <span class="perfil-cuerpo"></span>

        </a>

    </header>


    <main class="agenda-principal">

        <section class="agenda-contenedor">

            <header class="agenda-superior">

                <div>

                    <h1>Agenda</h1>

                    <p>
                        Organizá tus consultas, controles y turnos con tus pacientes.
                    </p>

                </div>


                <button
                    type="button"
                    id="botonAgregarEvento"
                    class="boton-agregar-evento">

                    + Agregar evento

                </button>

            </header>


            <section class="calendario">

                <header class="calendario-cabecera">

                    <button
                        type="button"
                        id="mesAnterior"
                        class="boton-mes"
                        aria-label="Mes anterior">

                        ‹

                    </button>


                    <h2 id="mesActual"></h2>


                    <button
                        type="button"
                        id="mesSiguiente"
                        class="boton-mes"
                        aria-label="Mes siguiente">

                        ›

                    </button>

                </header>


                <div
                    class="dias-semana"
                    aria-label="Días de la semana">

                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mié</div>
                    <div>Jue</div>
                    <div>Vie</div>
                    <div>Sáb</div>
                    <div>Dom</div>

                </div>


                <div
                    id="diasCalendario"
                    class="dias-calendario">

                </div>

            </section>


            <section
                class="referencias"
                aria-label="Referencias de eventos">

                <div class="referencia">
                    <span class="color-referencia turno"></span>
                    <span>Consulta</span>
                </div>

                <div class="referencia">
                    <span class="color-referencia estudio"></span>
                    <span>Estudio médico</span>
                </div>

                <div class="referencia">
                    <span class="color-referencia terapia"></span>
                    <span>Terapia</span>
                </div>

                <div class="referencia">
                    <span class="color-referencia medicacion"></span>
                    <span>Medicación</span>
                </div>

                <div class="referencia">
                    <span class="color-referencia control"></span>
                    <span>Control / seguimiento</span>
                </div>

            </section>

        </section>

    </main>


    <aside
        id="ventanaEvento"
        class="ventana-evento">

        <section class="formulario-evento">

            <button
                type="button"
                id="cerrarEvento"
                class="cerrar-evento"
                aria-label="Cerrar">

                ×

            </button>


            <header>

                <h2>Agregar consulta</h2>

                <p>
                    Completá la información de la consulta.
                </p>

            </header>


            <form>

                <label for="tituloEvento">
                    Nombre del evento
                </label>

                <input
                    type="text"
                    id="tituloEvento"
                    placeholder="Ej. Consulta médica">


                <label for="pacienteEvento">
                    Nombre del paciente
                </label>

                <input
                    type="text"
                    id="pacienteEvento"
                    placeholder="Ej. Juan Pérez">


                <label for="motivoEvento">
                    Motivo de consulta
                </label>

                <textarea
                    id="motivoEvento"
                    placeholder="Ej. Control de seguimiento...">
                </textarea>


                <label for="fechaEvento">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fechaEvento">


                <label for="horaEvento">
                    Hora
                </label>

                <input
                    type="time"
                    id="horaEvento">


                <label for="tipoEvento">
                    Tipo de evento
                </label>

                <select id="tipoEvento">

                    <option value="turno">
                        Consulta
                    </option>

                    <option value="estudio">
                        Estudio médico
                    </option>

                    <option value="terapia">
                        Terapia
                    </option>

                    <option value="medicacion">
                        Medicación
                    </option>

                    <option value="control">
                        Control / seguimiento
                    </option>

                </select>


                <label for="descripcionEvento">
                    Descripción
                </label>

                <textarea
                    id="descripcionEvento"
                    placeholder="Agregá información adicional...">
                </textarea>


                <button
                    type="button"
                    id="guardarEvento"
                    class="boton-guardar-evento">

                    Guardar consulta

                </button>

            </form>

        </section>

    </aside>


    <script src="agenda-medico.js"></script>

</body>

</html>
```
